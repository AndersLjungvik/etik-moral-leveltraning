<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16263a"><title>Olles tidsportal – litteraturhistoria</title>
<style>
:root{color-scheme:dark;--bg:#111d2e;--panel:#20334a;--line:#4d6579;--ink:#f9f2e8;--muted:#c5d2da;--gold:#f4cd8c;--mint:#a0ebce;--red:#ffa4a0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#304b56,transparent 55%),var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;min-height:48px}button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button:disabled{opacity:.68;cursor:default}a{color:var(--gold)}h1,h2,h3{line-height:1.17}h1{font-size:clamp(2rem,7vw,3.2rem);margin:10px 0 15px}h2{font-size:1.55rem;margin:0 0 12px}h3{font-size:1.13rem;margin:0 0 8px}p{margin:0 0 13px}.wrap{max-width:800px;margin:auto;padding:18px 15px 55px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}.brand{font-weight:950;letter-spacing:.1em;color:var(--mint)}.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.15em;color:var(--gold);font-weight:900}.hero{padding:clamp(22px,5vw,35px);background:linear-gradient(140deg,#254958,#28304b);border:1px solid #5e7a83;border-radius:24px;margin-bottom:16px}.hero p{color:#e2e8e9}.panel{padding:clamp(17px,4vw,26px);background:var(--panel);border:1px solid var(--line);border-radius:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:12px}.era{background:#2b4257;border:1px solid #5c7689;border-radius:17px;padding:20px;display:flex;flex-direction:column;gap:9px}.era .symbol{font-size:2.6rem}.era p{color:var(--muted);font-size:.89rem;flex:1}.primary{background:var(--gold);color:#30230f}.secondary{background:#36546a;color:white}.mint{background:var(--mint);color:#12372c}.outline{background:transparent;border:1px solid #6e8798;color:white}.full{width:100%}.btns{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{padding:12px 7px;text-align:center;border-radius:12px;background:#294257}.stat strong{display:block;font-size:1.55rem;color:var(--mint)}.stat small{font-size:.75rem;color:var(--muted)}.progress{height:10px;border-radius:99px;background:#10263a;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:linear-gradient(90deg,#f5c981,#a2ebc8);transition:width .2s}.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.83rem;color:var(--muted)}.question{font-size:clamp(1.2rem,4.5vw,1.65rem);font-weight:800;line-height:1.35;margin:20px 0}.think{border-left:4px solid var(--gold);background:#334355;border-radius:0 12px 12px 0;padding:13px 16px;margin:16px 0}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;color:white;background:#344e62;border:2px solid #5e778a;padding:15px 13px;display:flex;align-items:center;gap:13px;line-height:1.36}.choice span{flex:0 0 30px;height:30px;display:grid;place-items:center;border-radius:9px;background:#1d3547;color:var(--gold)}.choice.correct{background:#245447;border-color:#9ae5bd}.choice.wrong{background:#653e49;border-color:#f3a0a2}.feedback{padding:15px;border-radius:13px;background:#294c48;border:1px solid #6ba896;margin:15px 0}.feedback.bad{background:#593c45;border-color:#c9858b}.feedback small{color:#dce5e7}.hidden{display:none!important}.hint{font-size:.85rem;color:var(--muted)}.listrow{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #496276}.listrow:last-child{border:0}.notice{background:#403b38;border-left:4px solid var(--gold);border-radius:10px;padding:13px 16px;color:#fff0d5;font-size:.88rem;margin-top:18px}.bossfield{height:205px;position:relative;overflow:hidden;border-radius:17px;border:2px solid #66718b;background:radial-gradient(ellipse at top,#4a4961,#1b2942);margin:14px 0}.bossfield .floor{position:absolute;bottom:0;left:0;right:0;height:30px;background:#263c42}.fighter{position:absolute;bottom:25px;font-size:4.4rem;transition:left .55s ease,transform .55s ease;filter:drop-shadow(0 8px 5px #0006)}.herofig{left:12%}.bossfig{left:76%}.bossfig.lunge{transform:scale(1.3) translateX(-15px)}.herofig.hit{transform:rotate(-20deg) translateX(-12px)}.herofig.fire{transform:scale(1.2)}.bossfig.hit{transform:rotate(16deg)}.blast{position:absolute;top:58px;font-size:2.8rem;animation:blast .75s ease-out forwards;pointer-events:none}.blast.enemy{right:25%}.blast.hero{left:24%}@keyframes blast{to{transform:translateX(var(--dx)) scale(1.5) rotate(250deg);opacity:0}}.bossbar{height:9px;background:#10243c;border-radius:99px;overflow:hidden}.bossbar>div{height:100%;background:var(--red);transition:width .5s}.badge{display:inline-block;border:1px solid #607b89;padding:5px 10px;border-radius:99px;font-size:.75rem;color:var(--muted);margin:0 5px 8px 0}.footer{color:#9eb2bf;font-size:.79rem;margin:25px 0}@media(max-width:480px){.stats{gap:5px}.stat{padding:10px 3px}.bossfield{height:175px}.fighter{font-size:3.7rem}.wrap{padding:12px 12px 40px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><div class="wrap"><header class="top"><div class="brand">📜 OLLES TIDSPORTAL</div><button class="outline" onclick="home()">Hem</button></header><main id="app" aria-live="polite"></main><footer class="footer">Baserad på instuderingsfrågorna och texterna om antiken och renässansen. Medeltidens utdrag saknas; där används en grundöversikt. Framsteg sparas i den här webbläsaren.</footer></div>
<script>
'use strict';
const QUESTIONS=__QUESTIONS__;
const BOSS=__BOSS__;
const ERAS={a:{name:'Antiken',icon:'🏛️',tag:'Homeros · Iliaden · Odysséen · Lysistrate'},m:{name:'Medeltiden',icon:'🏰',tag:'Tristan och Isolde · Dante · tro och riddare'},r:{name:'Renässansen',icon:'🎭',tag:'Don Quijote · Hamlet · Gutenberg'}};
const STAGES={1:'Minns',2:'Koppla ihop',3:'Tänk ett steg till'};
const KEY='olle-tidsportal-v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const shuffle=a=>{let b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const blank=()=>({version:1,answers:{},completed:{},bossWins:0,finished:0});
let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null');if(!state||state.version!==1||!state.answers||!state.completed)state=blank()}catch(e){state=blank()}
let saveOk=true;
function save(){try{const val=JSON.stringify(state);localStorage.setItem(KEY,val);saveOk=localStorage.getItem(KEY)===val;return saveOk}catch(e){saveOk=false;return false}}
let run=[],idx=0,right=0,wrong=0,answerPlan=[],mode='home',selected=false,bossHp=5,hearts=3,bossDistance=0,reviewed=new Set();
function button(label,fn,style){return '<button class="'+(style||'primary')+'" onclick="'+fn.replace(/"/g,'&quot;')+'">'+label+'</button>'}
function positions(n){let a=[];while(a.length<n)a.push(...shuffle([0,1,2]));return a.slice(0,n)}
function options(q,at){const p=answerPlan[at%answerPlan.length],other=shuffle(q.answers.filter(x=>x!==q.correct));other.splice(p,0,q.correct);return other}
function stat(id){return state.answers[id]||{ok:0,bad:0,last:false}}
function priority(q){const s=stat(q.id);return (s.bad||0)*3-(s.ok||0)*1.3+(s.last===false&&s.bad?3:0)+Math.random()*2}
function summary(){const total=QUESTIONS.filter(q=>state.answers[q.id]).length;const solid=QUESTIONS.filter(q=>{const s=stat(q.id);return s.ok>=2&&s.last}).length;return {total,solid}}
function home(){mode='home';const x=summary();$('app').innerHTML='<section class="hero"><div class="eyebrow">Tre epoker • En finalboss</div><h1>Rädda litteraturhistorien!</h1><p>Bibliotekarien har blandat ihop författare, böcker och epoker. Träna på tre korta banor och rätta hans misstag i slutstriden.</p><span class="badge">Ingen tidspress</span><span class="badge">Tänk först – välj sedan</span><span class="badge">Svåra frågor återkommer</span></section><section class="panel"><h2>Välj en epok</h2><div class="grid">'+Object.keys(ERAS).map(id=>{const e=ERAS[id];return '<div class="era"><div class="symbol">'+e.icon+'</div><h3>'+e.name+'</h3><p>'+e.tag+'</p><div class="hint">'+(state.completed[id]?'✓ Bana genomförd':'3 korta nivåer')+'</div>'+button(state.completed[id]?'Repetera ↻':'Starta →',"start('"+id+"')",'primary full')+'</div>'}).join('')+'</div></section><section class="panel"><h2>📚 Finalboss: Den förvirrade bibliotekarien</h2><p>Han säger saker som inte stämmer. Hitta rättelsen och sätt böckerna på rätt plats. Varje rätt svar driver honom tillbaka.</p>'+button('Möt bibliotekarien ⚔️',"start('boss')",'mint full')+'<p class="hint" style="margin-top:10px">Bossen är öppen direkt, men blir lättare när du tränat epokerna.</p></section><section class="panel"><h2>Dina framsteg</h2><div class="stats"><div class="stat"><strong>'+x.total+'/'+QUESTIONS.length+'</strong><small>Frågor tränade</small></div><div class="stat"><strong>'+x.solid+'</strong><small>Starka minnen</small></div><div class="stat"><strong>'+state.bossWins+'</strong><small>Boss-segrar</small></div></div><div class="btns">'+button('🔁 Repetera svåra frågor',"start('review')",'secondary')+' '+button('📊 Progressrapport','report()','outline')+'</div></section>'}
function start(which){mode=which;right=0;wrong=0;idx=0;selected=false;reviewed=new Set();bossHp=5;hearts=3;bossDistance=0;
if(which==='boss'){run=shuffle(BOSS).slice(0,10).map(q=>({...q}));}
else if(which==='review'){run=QUESTIONS.slice().sort((a,b)=>priority(b)-priority(a)).slice(0,12).map(q=>({...q}));run=shuffle(run);}
else{run=[1,2,3].flatMap(level=>shuffle(QUESTIONS.filter(q=>q.era===which&&q.stage===level))).map(q=>({...q}));}
answerPlan=positions(Math.max(36,run.length+12));renderQuestion()}
function renderQuestion(){if(idx>=run.length){finish();return}selected=false;const q=run[idx],isBoss=mode==='boss',stage=isBoss?'Bossfight':STAGES[q.stage],name=isBoss?'Den förvirrade bibliotekarien':mode==='review'?'Blandad repetition':ERAS[mode].name;
let bossScene=isBoss?'<div class="bossfield" id="bossfield"><div class="floor"></div><div class="fighter herofig" id="herofig">🧑‍🎓</div><div class="fighter bossfig" id="bossfig" style="left:'+(76-bossDistance*9)+'%">🧙‍♂️</div><div id="blastSlot"></div></div><div class="meta"><span id="life">❤️ '+hearts+' liv</span><span id="bossEnergy">📚 '+bossHp+' böcker kvar</span></div><div class="bossbar"><div id="bossbarFill" style="width:'+(bossHp/5*100)+'%"></div></div>':'';
$('app').innerHTML='<section class="panel"><div class="eyebrow">'+esc(name)+' • '+esc(stage)+'</div><div class="meta"><span>Fråga '+(idx+1)+' av '+run.length+'</span><span>'+right+' rätt hittills</span></div><div class="progress"><div style="width:'+Math.round(idx/run.length*100)+'%"></div></div>'+bossScene+'<div class="question">'+(isBoss?'📕 Bibliotekarien påstår:<br>':'')+esc(q.q)+'</div><div class="think"><b>Tänk först.</b> Försök komma på svaret innan du visar alternativen.</div><div id="answers">'+button('Jag har tänkt – visa alternativen','showChoices()','mint full')+'</div></section><div class="btns">'+button('← Till startsidan','home()','outline')+'</div>';window.scrollTo(0,0)}
function showChoices(){if(selected)return;const q=run[idx],choices=options(q,idx);$('answers').innerHTML='<div class="choices">'+choices.map((s,i)=>'<button class="choice" data-value="'+esc(s)+'" onclick="choose('+i+')"><span>'+(i+1)+'</span>'+esc(s)+'</button>').join('')+'</div><p class="hint" style="margin-top:12px">Välj det bästa svaret. Alternativens placering varierar.</p>'}
function choose(i){if(selected)return;const buttons=Array.from(document.querySelectorAll('.choice'));if(buttons.length!==3||i<0||i>=3)return;selected=true;const q=run[idx],chosen=buttons[i].getAttribute('data-value'),ok=chosen===q.correct;buttons.forEach((b,j)=>{b.disabled=true;if(b.getAttribute('data-value')===q.correct)b.classList.add('correct');else if(i===j)b.classList.add('wrong')});
if(ok)right++;else wrong++;
if(mode==='boss'){if(ok){bossHp--;bossDistance=Math.max(0,bossDistance-1);bossAnim(true)}else{hearts--;bossDistance=Math.min(4,bossDistance+1);bossAnim(false)}}
else{const s=stat(q.id);if(ok){s.ok++;s.last=true}else{s.bad++;s.last=false;if(!reviewed.has(q.id)){reviewed.add(q.id);run.splice(Math.min(idx+3,run.length),0,{...q})}}s.at=Date.now();state.answers[q.id]=s;}
const saved=save(),explanation=q.why||('Rättelse: '+q.correct);
$('answers').insertAdjacentHTML('beforeend','<div class="feedback '+(ok?'':'bad')+'"><b>'+(ok?'✓ Rätt!':'↻ Inte riktigt.')+'</b><p style="margin:8px 0">'+esc(explanation)+'</p>'+(q.source?'<small>Underlag: '+esc(q.source)+'</small>':'')+'</div><p class="hint">'+(saved?'✓ Svaret sparat på denna enhet':'⚠ Kunde inte spara. Kontrollera webbläsarens inställningar.')+'</p>'+button(mode==='boss'&&(bossHp<=0||hearts<=0)?'Visa resultat →':'Nästa fråga →','next()','primary full'));
}
function next(){if(mode==='boss'&&(bossHp<=0||hearts<=0)){finish();return}idx++;renderQuestion()}
function bossAnim(ok){const b=$('bossfig'),h=$('herofig'),slot=$('blastSlot');b.style.left=(76-bossDistance*9)+'%';b.classList.add(ok?'hit':'lunge');h.classList.add(ok?'fire':'hit');slot.innerHTML='<span class="blast '+(ok?'hero':'enemy')+'" style="--dx:'+(ok?'220px':'-220px')+'">'+(ok?'📗':'💥')+'</span>';$('life').textContent='❤️ '+hearts+' liv';$('bossEnergy').textContent='📚 '+bossHp+' böcker kvar';$('bossbarFill').style.width=(bossHp/5*100)+'%'}
