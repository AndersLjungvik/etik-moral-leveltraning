isplay:block;font-size:1.55rem;color:var(--mint)}.stat small{font-size:.75rem;color:var(--muted)}.progress{height:10px;border-radius:99px;background:#10263a;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:linear-gradient(90deg,#f5c981,#a2ebc8);transition:width .2s}.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.83rem;color:var(--muted)}.question{font-size:clamp(1.2rem,4.5vw,1.65rem);font-weight:800;line-height:1.35;margin:20px 0}.think{border-left:4px solid var(--gold);background:#334355;border-radius:0 12px 12px 0;padding:13px 16px;margin:16px 0}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;color:white;background:#344e62;border:2px solid #5e778a;padding:15px 13px;display:flex;align-items:center;gap:13px;line-height:1.36}.choice span{flex:0 0 30px;height:30px;display:grid;place-items:center;border-radius:9px;background:#1d3547;color:var(--gold)}.choice.correct{background:#245447;border-color:#9ae5bd}.choice.wrong{background:#653e49;border-color:#f3a0a2}.feedback{padding:15px;border-radius:13px;background:#294c48;border:1px solid #6ba896;margin:15px 0}.feedback.bad{background:#593c45;border-color:#c9858b}.feedback small{color:#dce5e7}.hidden{display:none!important}.hint{font-size:.85rem;color:var(--muted)}.listrow{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #496276}.listrow:last-child{border:0}.notice{background:#403b38;border-left:4px solid var(--gold);border-radius:10px;padding:13px 16px;color:#fff0d5;font-size:.88rem;margin-top:18px}.bossfield{height:205px;position:relative;overflow:hidden;border-radius:17px;border:2px solid #66718b;background:radial-gradient(ellipse at top,#4a4961,#1b2942);margin:14px 0}.bossfield .floor{position:absolute;bottom:0;left:0;right:0;height:30px;background:#263c42}.fighter{position:absolute;bottom:25px;font-size:4.4rem;transition:left .55s ease,transform .55s ease;filter:drop-shadow(0 8px 5px #0006)}.herofig{left:12%}.bossfig{left:76%}.bossfig.lunge{transform:scale(1.3) translateX(-15px)}.herofig.hit{transform:rotate(-20deg) translateX(-12px)}.herofig.fire{transform:scale(1.2)}.bossfig.hit{transform:rotate(16deg)}.blast{position:absolute;top:58px;font-size:2.8rem;animation:blast .75s ease-out forwards;pointer-events:none}.blast.enemy{right:25%}.blast.hero{left:24%}@keyframes blast{to{transform:translateX(var(--dx)) scale(1.5) rotate(250deg);opacity:0}}.bossbar{height:9px;background:#10243c;border-radius:99px;overflow:hidden}.bossbar>div{height:100%;background:var(--red);transition:width .5s}.badge{display:inline-block;border:1px solid #607b89;padding:5px 10px;border-radius:99px;font-size:.75rem;color:var(--muted);margin:0 5px 8px 0}.footer{color:#9eb2bf;font-size:.79rem;margin:25px 0}@media(max-width:480px){.stats{gap:5px}.stat{padding:10px 3px}.bossfield{height:175px}.fighter{font-size:3.7rem}.wrap{padding:12px 12px 40px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

'use strict';
const QUESTIONS=[{"id":"a01","era":"a","stage":1,"q":"Vilken tidsperiod anger häftet för antiken?","correct":"Cirka 800 f.Kr.–500 e.Kr.","answers":["Cirka 800 f.Kr.–500 e.Kr.","Cirka 500–1500 e.Kr.","Cirka 1500–1700 e.Kr."],"why":"Cirka 800 f.Kr.–500 e.Kr.","source":"Antiken s. 1"},{"id":"a02","era":"a","stage":1,"q":"Vem sägs ha berättat Iliaden och Odysséen?","correct":"Homeros","answers":["Homeros","William Shakespeare","Miguel de Cervantes"],"why":"Homeros","source":"Antiken s. 2"},{"id":"a03","era":"a","stage":1,"q":"Vilka tre litterära genrer nämns för antiken?","correct":"Epik, lyrik och dramatik","answers":["Epik, lyrik och dramatik","Roman, deckare och reportage","Saga, nyhet och debatt"],"why":"Epik, lyrik och dramatik","source":"Antiken s. 2"},{"id":"a04","era":"a","stage":1,"q":"Vad handlar Iliaden framför allt om?","correct":"Kriget kring Troja och Akilles vrede","answers":["Kriget kring Troja och Akilles vrede","Odysseus hela hemresa","Hamlets hämnd"],"why":"Kriget kring Troja och Akilles vrede","source":"Antiken s. 1"},{"id":"a05","era":"a","stage":2,"q":"Koppla rätt författare till verket Lysistrate.","correct":"Aristofanes","answers":["Aristofanes","Sofokles","Sapfo"],"why":"Aristofanes","source":"Antiken s. 2; Lysistrate"},{"id":"a06","era":"a","stage":2,"q":"Koppla rätt författare till Kung Oidipus.","correct":"Sofokles","answers":["Sofokles","Aristofanes","Homeros"],"why":"Sofokles","source":"Antiken s. 2"},{"id":"a07","era":"a","stage":2,"q":"Vilket verk handlar om Odysseus resa hem från Troja?","correct":"Odysséen","answers":["Odysséen","Iliaden","Hamlet"],"why":"Odysséen","source":"Antiken s. 1; Odysséen"},{"id":"a08","era":"a","stage":2,"q":"Vem är den antika lyriker som nämns i häftet?","correct":"Sapfo","answers":["Sapfo","Dante","Penelope"],"why":"Sapfo","source":"Antiken s. 2"},{"id":"a09","era":"a","stage":3,"q":"Varför är Lysistrate en komedi med ett allvarligt budskap?","correct":"Humor används för att kritisera kriget","answers":["Humor används för att kritisera kriget","Den handlar bara om att vinna ett slag","Den berättar hur Odysseus hittar hem"],"why":"Humor används för att kritisera kriget","source":"Lysistrate s. 23–26"},{"id":"a10","era":"a","stage":3,"q":"Vad är kvinnornas viktigaste taktik i Lysistrate?","correct":"En kärleksstrejk för att få slut på kriget","answers":["En kärleksstrejk för att få slut på kriget","De bygger en trojansk häst","De utser en ny kung i Troja"],"why":"En kärleksstrejk för att få slut på kriget","source":"Lysistrate s. 24–26"},{"id":"a11","era":"a","stage":3,"q":"Vilket påstående om den trojanska hästen är mest korrekt?","correct":"Den hör till sagorna om Troja men skildras inte i själva Iliaden","answers":["Den hör till sagorna om Troja men skildras inte i själva Iliaden","Den är Iliadens första scen","Den uppfanns av Hamlet"],"why":"Den hör till sagorna om Troja men skildras inte i själva Iliaden","source":"Antiken och Iliaden, förtydligande"},{"id":"a12","era":"a","stage":3,"q":"Hur skiljer sig tragedi från komedi enligt häftet?","correct":"Tragedi slutar olyckligt, komedi lyckligt","answers":["Tragedi slutar olyckligt, komedi lyckligt","Båda måste alltid sluta lyckligt","Tragedi är en dikt, komedi en krönika"],"why":"Tragedi slutar olyckligt, komedi lyckligt","source":"Antiken s. 2"},{"id":"m01","era":"m","stage":1,"q":"Vilken ungefärlig period brukar kallas medeltiden i Europa?","correct":"Cirka 500–1500","answers":["Cirka 500–1500","Cirka 800 f.Kr.–500 e.Kr.","Cirka 1800–1900"],"why":"Cirka 500–1500","source":"Allmän epoköversikt – kontrollera klassens periodisering"},{"id":"m02","era":"m","stage":1,"q":"Vilket verk hör till medeltiden?","correct":"Tristan och Isolde","answers":["Tristan och Isolde","Lysistrate","Hamlet"],"why":"Tristan och Isolde","source":"Instuderingsfrågor: Medeltiden"},{"id":"m03","era":"m","stage":1,"q":"Vem skrev Den gudomliga komedin?","correct":"Dante Alighieri","answers":["Dante Alighieri","Homeros","William Shakespeare"],"why":"Dante Alighieri","source":"Allmän litteraturhistoria – medeltidsutdrag saknas"},{"id":"m04","era":"m","stage":1,"q":"Vilket tema är centralt i berättelsen om Tristan och Isolde?","correct":"Kärlek i konflikt med plikt och lojalitet","answers":["Kärlek i konflikt med plikt och lojalitet","Ett krig mellan Aten och Sparta","En riddare som slåss mot väderkvarnar"],"why":"Kärlek i konflikt med plikt och lojalitet","source":"Allmän litteraturhistoria – medeltidsutdrag saknas"},{"id":"m05","era":"m","stage":2,"q":"Koppla rätt verk till Dante.","correct":"Den gudomliga komedin","answers":["Den gudomliga komedin","Don Quijote","Kung Oidipus"],"why":"Den gudomliga komedin","source":"Instuderingsfrågor: Medeltiden"},{"id":"m06","era":"m","stage":2,"q":"Koppla rätt verk till riddarkärlek och lojalitetskonflikt.","correct":"Tristan och Isolde","answers":["Tristan och Isolde","Odysséen","Lysistrate"],"why":"Tristan och Isolde","source":"Allmän litteraturhistoria – medeltidsutdrag saknas"},{"id":"m07","era":"m","stage":2,"q":"Vilken världsbild förknippas särskilt med medeltida europeisk litteratur?","correct":"Kristen tro, riddare och ståndssamhälle","answers":["Kristen tro, riddare och ståndssamhälle","Modern rymdforskning och robotar","Industristäder och fabriker"],"why":"Kristen tro, riddare och ståndssamhälle","source":"Allmän litteraturhistoria – medeltidsutdrag saknas"},{"id":"m08","era":"m","stage":2,"q":"Vilken beskrivning passar Den gudomliga komedin?","correct":"En vandring genom helvetet, skärselden och paradiset","answers":["En vandring genom helvetet, skärselden och paradiset","En berättelse om Odysseus och cyklopen","En komedi om kvinnors fredsaktion"],"why":"En vandring genom helvetet, skärselden och paradiset","source":"Allmän litteraturhistoria – medeltidsutdrag saknas"},{"id":"m09","era":"m","stage":3,"q":"Varför kan Tristan och Isolde kopplas till medeltidens litteratur?","correct":"Kärlek ställs mot lojalitet och sociala plikter","answers":["Kärlek ställs mot lojalitet och sociala plikter","Den handlar om renässansens boktryck","Den utspelas under det trojanska kriget"],"why":"Kärlek ställs mot lojalitet och sociala plikter","source":"Allmän litteraturhistoria – medeltidsutdrag saknas"},{"id":"m10","era":"m","stage":3,"q":"Varför visar Dantes verk en medeltida världsbild?","correct":"Kristen tro och livet efter döden präglar resan","answers":["Kristen tro och livet efter döden präglar resan","Handlingen bygger på modern genteknik","Gudarna på Olympen styr alla händelser"],"why":"Kristen tro och livet efter döden präglar resan","source":"Allmän litteraturhistoria – medeltidsutdrag saknas"},{"id":"m11","era":"m","stage":3,"q":"Vad är klokast att svara om författaren till Tristan och Isolde?","correct":"Berättelsen finns i flera medeltida versioner av olika författare","answers":["Berättelsen finns i flera medeltida versioner av olika författare","Homeros skrev den säkert","Shakespeare skrev den säkert"],"why":"Berättelsen finns i flera medeltida versioner av olika författare","source":"Allmän litteraturhistoria – kontrollera klassens version"},{"id":"m12","era":"m","stage":3,"q":"Vilken jämförelse mellan epokerna stämmer bäst?","correct":"Medeltida texter har ofta kristen prägel, antika grekiska texter ofta gudar och hjältar","answers":["Medeltida texter har ofta kristen prägel, antika grekiska texter ofta gudar och hjältar","Alla tre epokerna hade samma författare","Medeltiden kom efter renässansen"],"why":"Medeltida texter har ofta kristen prägel, antika grekiska texter ofta gudar och hjältar","source":"Allmän litteraturhistorisk jämförelse"}];
const BOSS=__BOSS__;
const ERAS={a:{name:'Antiken',icon:'🏛️',tag:'Homeros · Iliaden · Odysséen · Lysistrate'},m:{name:'Medeltiden',icon:'🏰',tag:'Tristan och Isolde · Dante · tro och riddare'},r:{name:'Renässansen',icon:'🎭',tag:'Don Quijote · Hamlet · Gutenberg'}};
const STAGES={1:'Minns',2:'Koppla ihop',3:'Tänk ett steg till'};
const KEY='olle-tidsportal-v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const shuffle=a=>{let b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const blank=()=>({version:1,answers:{},completed:{},bossWins:0,finished:0});
let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null');if(!state||state.version!==1||!state.answers||!state.completed)state=blank()}catch(e){state=blank()}
let saveOk=true;
function save(){try{const val=JSON.stringify(state);localStorage.setItem(KEY,val);saveOk=localStorage.getItem(KEY)===val;return saveOk}catch(e){saveOk=false;return false}}
let run=[],idx=0,right=0,wrong=0,answerPlan=[],mode='home',selected=false,bossHp=5,hearts=3,bossDistance=0,reviewed=new Set();
function button(label,fn,style){return '<button class="'+(style||'primary')+'" onclick="'+fn.replace(/"/g,'&quot;')+'">'+label+'</button>'}
function positions(n){let a=[];while(a.length<n)a.push(...shuffle([0,1,2]));return a.slice(0,n)}
function options(q,at){const p=answerPlan[at%answerPlan.length],other=shuffle(q.answers.filter(x=>x!==q.correct));other.splice(p,0,q.correct);return other}
function stat(id){return state.answers[id]||{ok:0,bad:0,last:false}}
function priority(q){const s=stat(q.id);return (s.bad||0)*3-(s.ok||0)*1.3+(s.last===false&&s.bad?3:0)+Math.random()*2}
function summary(){const total=QUESTIONS.filter(q=>state.answers[q.id]).length;const solid=QUESTIONS.filter(q=>{const s=stat(q.id);return s.ok>=2&&s.last}).length;return {total,solid}}
function home(){mode='home';const x=summary();$('app').innerHTML='<section class="hero"><div class="eyebrow">Tre epoker • En finalboss</div><h1>Rädda litteraturhistorien!</h1><p>Bibliotekarien har blandat ihop författare, böcker och epoker. Träna på tre korta banor och rätta hans misstag i slutstriden.</p><span class="badge">Ingen tidspress</span><span class="badge">Tänk först – välj sedan</span><span class="badge">Svåra frågor återkommer</span></section><section class="panel"><h2>Välj en epok</h2><div class="grid">'+Object.keys(ERAS).map(id=>{const e=ERAS[id];return '<div class="era"><div class="symbol">'+e.icon+'</div><h3>'+e.name+'</h3><p>'+e.tag+'</p><div class="hint">'+(state.completed[id]?'✓ Bana genomförd':'3 korta nivåer')+'</div>'+button(state.completed[id]?'Repetera ↻':'Starta →',"start('"+id+"')",'primary full')+'</div>'}).join('')+'</div></section><section class="panel"><h2>📚 Finalboss: Den förvirrade bibliotekarien</h2><p>Han säger saker som inte stämmer. Hitta rättelsen och sätt böckerna på rätt plats. Varje rätt svar driver honom tillbaka.</p>'+button('Möt bibliotekarien ⚔️',"start('boss')",'mint full')+'<p class="hint" style="margin-top:10px">Bossen är öppen direkt, men blir lättare när du tränat epokerna.</p></section><section class="panel"><h2>Dina framsteg</h2><div class="stats"><div class="stat"><strong>'+x.total+'/'+QUESTIONS.length+'</strong><small>Frågor tränade</small></div><div class="stat"><strong>'+x.solid+'</strong><small>Starka minnen</small></div><div class="stat"><strong>'+state.bossWins+'</strong><small>Boss-segrar</small></div></div><div class="btns">'+button('🔁 Repetera svåra frågor',"start('review')",'secondary')+' '+button('📊 Progressrapport','report()','outline')+'</div></section>'}
function start(which){mode=which;right=0;wrong=0;idx=0;selected=false;reviewed=new Set();bossHp=5;hearts=3;bossDistance=0;
if(which==='boss'){run=shuffle(BOSS).slice(0,10).map(q=>({...q}));}
else if(which==='review'){run=QUESTIONS.slice().sort((a,b)=>priority(b)-priority(a)).slice(0,12).map(q=>({...q}));run=shuffle(run);}
else{run=[1,2,3].flatMap(level=>shuffle(QUESTIONS.filter(q=>q.era===which&&q.stage===level))).map(q=>({...q}));}
answerPlan=positions(Math.max(36,run.length+12));renderQuestion()}
function renderQuestion(){if(idx>=run.length){finish();return}selected=false;const q=run[idx],isBoss=mode==='boss',stage=isBoss?'Bossfight':STAGES[q.stage],name=isBoss?'Den förvirrade bibliotekarien':mode==='review'?'Blandad repetition':ERAS[mode].name;
let bossScene=isBoss?'<div class="bossfield" id="bossfield"><div class="floor"></div><div class="fighter herofig" id="herofig">🧑‍🎓</div><div class="fighter bossfig" id="bossfig" style="left:'+(76-bossDistance*9)+'%">🧙‍♂️</div><div id="blastSlot"></div></div><div class="meta"><span id="life">❤️ '+hearts+' liv</span><span id="bossEnergy">📚 '+bossHp+' böcker kvar</span></div><div class="bossbar"><div id="bossbarFill" style="width:'+(bossHp/5*100)+'%"></div></div>':'';
$('app').innerHTML='<section class="panel"><div class="eyebrow">'+esc(name)+' • '+esc(stage)+'</div><div class="meta"><span>Fråga '+(idx+1)+' av '+run.length+'</span><span>'+right+' rätt hittills</span></div><div class="progress"><div style="width:'+Math.round(idx/run.length*100)+'%"></div></div>'+bossScene+'<div class="question">'+(isBoss?'📕 Bibliotekarien påstår:<br>':'')+esc(q.q)+'</div><div class="think"><b>Tänk först.</b> Försök komma på svaret innan du visar alternativen.</div><div id="answers">'+button('Jag har tänkt – visa alternativen','showChoices()','mint full')+'</div></section><div class="btns">'+button('← Till startsidan','home()','outline')+'</div>';window.scrollTo(0,0)}
function showChoices(){if(selected)return;const q=run[idx],choices=options(q,idx);$('answers').innerHTML='<div class="choices">'+choices.map((s,i)=>'<button class="choice" data-value="'+esc(s)+'" onclick="choose('+i+')"><span>'+(i+1)+'</span>'+esc(s)+'</button>').join('')+'</div><p class="hint" style="margin-top:12px">Välj det bästa svaret. Alternativens placering varierar.</p>'}
function choose(i){if(selected)return;const buttons=Array.from(document.querySelectorAll('.choice'));if(buttons.length!==3||i<0||i>=3)return;selected=true;const q=run[idx],chosen=buttons[i].getAttribute('data-value'),ok=chosen===q.correct;buttons.forEach((b,j)=>{b.disabled=true;if(b.getAttribute('data-value')===q.correct)b.classList.add('correct');else if(i===j)b.classList.add('wrong')});
if(ok)right++;else wrong++;
if(mode==='boss'){if(ok){bossHp--;bossDistance=Math.max(0,bossDistance-1);bossAnim(true)}else{hearts--;bossDistance=Math.min(4,bossDistance+1);bossAnim(false)}}
else{const s=stat(q.id);if(ok){s.ok++;s.last=true}else{s.bad++;s.last=false;if(!reviewed.has(q.id)){reviewed.add(q.id);run.splice(Math.min(idx+3,run.length),0,{...q})}}s.at=Date.now();state.answers[q.id]=s;}
const saved=save(),explanation=q.why||('Rättelse: '+q.correct);
$('answers').insertAdjacentHTML('beforeend','<div class="feedback '+(ok?'':'bad')+'"><b>'+(ok?'✓ Rätt!':'↻ Inte riktigt.')+'</b><p style="margin:8px 0">'+esc(explanation)+'</p>'+(q.source?'<small>Underlag: '+esc(q.source)+'</small>':'')+'</div><p class="hint">'+(saved?'✓ Svaret sparat på denna enhet':'⚠ Kunde inte spara. Kontrollera webbläsarens inställningar.')+'</p>'+button(mode==='boss'&&(bossHp<=0||hearts<=0)?'Visa resultat →':'Nästa fråga →','next()','primary full'));
}
function next(){if(mode==='boss'&&(bossHp<=0||hearts<=0)){finish();return}idx++;renderQuestion()}
function bossAnim(ok){const b=$('bossfig'),h=$('herofig'),slot=$('blastSlot');b.style.left=(76-bossDistance*9)+'%';b.classList.add(ok?'hit':'lunge');h.classList.add(ok?'fire':'hit');slot.innerHTML='<span class="blast '+(ok?'hero':'enemy')+'" style="--dx:'+(ok?'220px':'-220px')+'">'+(ok?'📗':'💥')+'</span>';$('life').textContent='❤️ '+hearts+' liv';$('bossEnergy').textContent='📚 '+bossHp+' böcker kvar';$('bossbarFill').style.width=(bossHp/5*100)+'%'}
function finish(){const isBoss=mode==='boss',win=isBoss&&bossHp<=0;if(isBoss){if(win)state.bossWins++}else if(mode!=='review')state.completed[mode]=true;state.finished++;const saved=save();const count=right+wrong;
$('app').innerHTML='<section class="hero"><div class="eyebrow">'+(win?'🏆 Biblioteket räddat!':'Träningspass avslutat')+'</div><h1>'+(win?'Du besegrade bibliotekarien!':'Bra jobbat, Olle!')+'</h1><p>'+(isBoss?(win?'Du avslöjade fem av hans felaktiga påståenden.':'Du tog '+(3-hearts)+' träffar. Prova igen när du repeterat.'):'Du har tränat på '+count+' svar. Svåra frågor återkommer nästa gång.')+'</p><div class="stats"><div class="stat"><strong>'+right+'</strong><small>Rätt</small></div><div class="stat"><strong>'+wrong+'</strong><small>Fel</small></div><div class="stat"><strong>'+state.bossWins+'</strong><small>Boss-segrar totalt</small></div></div></section><section class="panel"><h2>Vad gör du nu?</h2><p>Ta gärna en paus innan du repeterar. Att försöka minnas igen efter en stund är själva träningen.</p><div class="btns">'+button('Till kartan','home()','primary')+' '+button('Repetera svåra',"start('review')",'secondary')+' '+button('Progressrapport','report()','outline')+'</div>'+(saved?'':'<div class="notice">Framstegen kunde inte sparas i webbläsaren.</div>')+'</section>';window.scrollTo(0,0)}
function reportText(){const now=new Date().toLocaleString('sv-SE');const lines=['OLLES TIDSPORTAL – PROGRESSRAPPORT','Datum: '+now,'',...Object.keys(ERAS).map(id=>{const arr=QUESTIONS.filter(q=>q.era===id),tried=arr.filter(q=>state.answers[q.id]),solid=arr.filter(q=>{const s=stat(q.id);return s.ok>=2&&s.last});return ERAS[id].name+': '+tried.length+'/'+arr.length+' frågor tränade, '+solid.length+' starka minnen, '+(state.completed[id]?'bana genomförd':'bana ej genomförd')}),'','Boss-segrar: '+state.bossWins,'Avslutade pass: '+state.finished,'','FRÅGOR ATT REPETERA:'];const needs=QUESTIONS.filter(q=>{const s=state.answers[q.id];return s&&(!s.last||s.bad>s.ok)}).sort((a,b)=>priority(b)-priority(a));if(!needs.length)lines.push('Inga felaktiga svar registrerade just nu.');else needs.slice(0,15).forEach(q=>lines.push('• '+ERAS[q.era].name+': '+q.q));lines.push('','Observera: rapporten visar träningsaktivitet, inte ett provbetyg. Resultaten finns lokalt på Olles enhet.');return lines.join('\n')}
function report(){mode='report';const x=summary();$('app').innerHTML='<section class="hero"><div class="eyebrow">📊 Progressrapport</div><h1>Så går det för Olle</h1><p>Resultaten uppdateras när Olle svarar. Kopiera rapporten och skicka den i ett meddelande.</p><div class="stats"><div class="stat"><strong>'+x.total+'/'+QUESTIONS.length+'</strong><small>Tränade frågor</small></div><div class="stat"><strong>'+x.solid+'</strong><small>Starka minnen</small></div><div class="stat"><strong>'+state.bossWins+'</strong><small>Boss-segrar</small></div></div></section><section class="panel"><h2>Epokerna</h2>'+Object.keys(ERAS).map(id=>{const arr=QUESTIONS.filter(q=>q.era===id),tried=arr.filter(q=>state.answers[q.id]),solid=arr.filter(q=>{const s=stat(q.id);return s.ok>=2&&s.last});return '<div class="listrow"><span>'+ERAS[id].icon+' '+ERAS[id].name+'</span><span>'+tried.length+'/'+arr.length+' tränade · '+solid.length+' starka</span></div>'}).join('')+'<div class="notice">”Starka minnen” betyder minst två rätta svar och rätt vid senaste försöket. Det är inte en bedömning av provkunskaper. Resultat på andra enheter syns inte här.</div><div class="btns">'+button('📋 Kopiera rapport','copyReport()','mint full')+' '+button('Till kartan','home()','secondary full')+'</div><p id="copyStatus" class="hint" aria-live="polite"></p></section>'}
async function copyReport(){const text=reportText();try{await navigator.clipboard.writeText(text);$('copyStatus').textContent='Rapporten är kopierad! Klistra in den i ett sms eller i chatten.'}catch(e){window.prompt('Markera och kopiera rapporten:',text)}}
home();
</script></body></html>
