const bossScene=isBoss?'<div class="bossfield" id="bossfield"><div class="floor"></div><div class="fighter herofig" id="herofig"><svg viewBox="0 0 95 100" width="90" height="96" aria-label="En bok"><g stroke="#26231e" stroke-width="2.5" fill="#faf8f3"><path d="M8 27q21-9 39 3 17-12 40-3v57q-23-8-40 3-20-10-39-3z"/><path d="M47 30v57M14 38q13-5 27 2M14 48q13-5 27 2M14 58q13-5 27 2M53 40q15-6 28-2M53 50q15-6 28-2M53 60q15-6 28-2"/></g></svg></div><div class="fighter bossfig" id="bossfig" style="left:'+(76-bossDistance*9)+'%"><svg viewBox="0 0 105 110" width="100" height="105" aria-label="Bibliotekarie med böcker"><g stroke="#28231f" stroke-width="2.7" fill="#faf8f3"><circle cx="53" cy="27" r="19"/><path d="M26 105V70q8-22 27-22t27 22v35M24 106h58M38 20h11m11 0h12M49 25h11M28 66l-15 13 17 15M77 67l14 14-13 13"/><path d="M29 74h48v24H29zM29 83h48M35 76v20M70 76v20"/></g></svg></div><div id="blastSlot"></div></div><div class="meta"><span id="life">Liv kvar: '+hearts+'</span><span id="bossEnergy">Fel kvar att rätta: '+bossHp+'</span></div><div class="bossbar"><div id="bossbarFill" style="width:'+(bossHp/5*100)+'%"></div></div>':'';
$('app').innerHTML='<section class="panel"><div class="paper-head"><div class="paper-kicker">Instuderingsfrågor • '+esc(name)+'</div><h2>'+esc(name)+'</h2><div class="meta"><span>Del: '+esc(stage)+'</span><span>Fråga '+(idx+1)+' / '+run.length+'</span></div></div><div class="progress"><div style="width:'+Math.round(idx/run.length*100)+'%"></div></div>'+(reference?'<div class="source-question"><span class="paper-number">UR INSTUDERINGSFRÅGORNA</span><div class="paper-quote">'+esc(reference)+'</div></div>':'')+bossScene+'<div class="paper-number">'+(isBoss?'RÄTTA PÅSTÅENDET': 'ÖVNING '+(idx+1)+' • '+esc(stage).toUpperCase())+'</div><div class="question">'+(isBoss?'<span class="boss-ink">Bibliotekarien har skrivit:</span><div style="margin-top:14px"></div>':'')+esc(q.q)+'</div><div class="paper-lines" aria-hidden="true"></div><div class="think"><b>Försök minnas innan du tittar.</b> Tänk eller säg svaret högt. Du behöver inte skriva.</div><div id="answers">'+button('Visa svarsalternativen →','showChoices()','primary full')+'</div>'+(q.source?'<p class="hint" style="margin-top:15px">Underlag: '+esc(q.source)+'</p>':'')+'</section><div class="btns">'+button('← Till innehållsförteckningen','home()','outline')+'</div>';window.scrollTo(0,0)}
function showChoices(){if(selected)return;const q=run[idx],choices=options(q,idx);$('answers').innerHTML='<div class="choices">'+choices.map((s,i)=>'<button class="choice" data-value="'+esc(s)+'" onclick="choose('+i+')"><span>'+(i+1)+'</span>'+esc(s)+'</button>').join('')+'</div><p class="hint" style="margin-top:12px">Välj det bästa svaret. Alternativens placering varierar.</p>'}
function choose(i){if(selected)return;const buttons=Array.from(document.querySelectorAll('.choice'));if(buttons.length!==3||i<0||i>=3)return;selected=true;const q=run[idx],chosen=buttons[i].getAttribute('data-value'),ok=chosen===q.correct;buttons.forEach((b,j)=>{b.disabled=true;if(b.getAttribute('data-value')===q.correct)b.classList.add('correct');else if(i===j)b.classList.add('wrong')});
if(ok)right++;else wrong++;
if(mode==='boss'){if(ok){bossHp--;bossDistance=Math.max(0,bossDistance-1);bossAnim(true)}else{hearts--;bossDistance=Math.min(4,bossDistance+1);bossAnim(false)}}
else{const s=stat(q.id);if(ok){s.ok++;s.last=true}else{s.bad++;s.last=false;if(!reviewed.has(q.id)){reviewed.add(q.id);run.splice(Math.min(idx+3,run.length),0,{...q})}}s.at=Date.now();state.answers[q.id]=s;}
const saved=save(),explanation=q.why||('Rättelse: '+q.correct);
$('answers').insertAdjacentHTML('beforeend','<div class="feedback '+(ok?'':'bad')+'"><b>'+(ok?'✓ Rätt!':'↻ Inte riktigt.')+'</b><p style="margin:8px 0">'+esc(explanation)+'</p>'+(q.source?'<small>Underlag: '+esc(q.source)+'</small>':'')+'</div><p class="hint">'+(saved?'✓ Svaret sparat på denna enhet':'⚠ Kunde inte spara. Kontrollera webbläsarens inställningar.')+'</p>'+button(mode==='boss'&&(bossHp<=0||hearts<=0)?'Visa resultat →':'Nästa fråga →','next()','primary full'));
}
function next(){if(mode==='boss'&&(bossHp<=0||hearts<=0)){finish();return}idx++;renderQuestion()}
function bossAnim(ok){const b=$('bossfig'),h=$('herofig'),slot=$('blastSlot');b.style.left=(76-bossDistance*9)+'%';b.classList.add(ok?'hit':'lunge');h.classList.add(ok?'fire':'hit');slot.innerHTML='<span class="blast '+(ok?'hero':'enemy')+'" style="--dx:'+(ok?'220px':'-220px')+'">'+(ok?'✓':'✕')+'</span>';$('life').textContent='Liv kvar: '+hearts;$('bossEnergy').textContent='Fel kvar att rätta: '+bossHp;$('bossbarFill').style.width=(bossHp/5*100)+'%'}
function finish(){const isBoss=mode==='boss',win=isBoss&&bossHp<=0;if(isBoss){if(win)state.bossWins++}else if(mode!=='review')state.completed[mode]=true;state.finished++;const saved=save();const count=right+wrong;
$('app').innerHTML='<section class="hero"><div class="eyebrow">'+(win?'🏆 Biblioteket räddat!':'Träningspass avslutat')+'</div><h1>'+(win?'Du besegrade bibliotekarien!':'Bra jobbat, Olle!')+'</h1><p>'+(isBoss?(win?'Du avslöjade fem av hans felaktiga påståenden.':'Du tog '+(3-hearts)+' träffar. Prova igen när du repeterat.'):'Du har tränat på '+count+' svar. Svåra frågor återkommer nästa gång.')+'</p><div class="stats"><div class="stat"><strong>'+right+'</strong><small>Rätt</small></div><div class="stat"><strong>'+wrong+'</strong><small>Fel</small></div><div class="stat"><strong>'+state.bossWins+'</strong><small>Boss-segrar totalt</small></div></div></section><section class="panel"><h2>Vad gör du nu?</h2><p>Ta gärna en paus innan du repeterar. Att försöka minnas igen efter en stund är själva träningen.</p><div class="btns">'+button('Till kartan','home()','primary')+' '+button('Repetera svåra',"start('review')",'secondary')+' '+button('Progressrapport','report()','outline')+'</div>'+(saved?'':'<div class="notice">Framstegen kunde inte sparas i webbläsaren.</div>')+'</section>';window.scrollTo(0,0)}
function reportText(){const now=new Date().toLocaleString('sv-SE');const lines=['OLLES TIDSPORTAL – PROGRESSRAPPORT','Datum: '+now,'',...Object.keys(ERAS).map(id=>{const arr=QUESTIONS.filter(q=>q.era===id),tried=arr.filter(q=>state.answers[q.id]),solid=arr.filter(q=>{const s=stat(q.id);return s.ok>=2&&s.last});return ERAS[id].name+': '+tried.length+'/'+arr.length+' frågor tränade, '+solid.length+' starka minnen, '+(state.completed[id]?'bana genomförd':'bana ej genomförd')}),'','Boss-segrar: '+state.bossWins,'Avslutade pass: '+state.finished,'','FRÅGOR ATT REPETERA:'];const needs=QUESTIONS.filter(q=>{const s=state.answers[q.id];return s&&(!s.last||s.bad>s.ok)}).sort((a,b)=>priority(b)-priority(a));if(!needs.length)lines.push('Inga felaktiga svar registrerade just nu.');else needs.slice(0,15).forEach(q=>lines.push('• '+ERAS[q.era].name+': '+q.q));lines.push('','Observera: rapporten visar träningsaktivitet, inte ett provbetyg. Resultaten finns lokalt på Olles enhet.');return lines.join('\n')}
function report(){mode='report';const x=summary();$('app').innerHTML='<section class="hero"><div class="eyebrow">📊 Progressrapport</div><h1>Så går det för Olle</h1><p>Resultaten uppdateras när Olle svarar. Kopiera rapporten och skicka den i ett meddelande.</p><div class="stats"><div class="stat"><strong>'+x.total+'/'+QUESTIONS.length+'</strong><small>Tränade frågor</small></div><div class="stat"><strong>'+x.solid+'</strong><small>Starka minnen</small></div><div class="stat"><strong>'+state.bossWins+'</strong><small>Boss-segrar</small></div></div></section><section class="panel"><h2>Epokerna</h2>'+Object.keys(ERAS).map(id=>{const arr=QUESTIONS.filter(q=>q.era===id),tried=arr.filter(q=>state.answers[q.id]),solid=arr.filter(q=>{const s=stat(q.id);return s.ok>=2&&s.last});return '<div class="listrow"><span>'+ERAS[id].icon+' '+ERAS[id].name+'</span><span>'+tried.length+'/'+arr.length+' tränade · '+solid.length+' starka</span></div>'}).join('')+'<div class="notice">”Starka minnen” betyder minst två rätta svar och rätt vid senaste försöket. Det är inte en bedömning av provkunskaper. Resultat på andra enheter syns inte här.</div><div class="btns">'+button('📋 Kopiera rapport','copyReport()','mint full')+' '+button('Till kartan','home()','secondary full')+'</div><p id="copyStatus" class="hint" aria-live="polite"></p></section>'}
async function copyReport(){const text=reportText();try{await navigator.clipboard.writeText(text);$('copyStatus').textContent='Rapporten är kopierad! Klistra in den i ett sms eller i chatten.'}catch(e){window.prompt('Markera och kopiera rapporten:',text)}}
home();
</script></body></html>
