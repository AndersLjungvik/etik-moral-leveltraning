<script>

Q.push(...[["b1","b",1,"Vad innebär privatekonomi?","Hur en person eller ett hushåll använder och planerar sina pengar","Hur staten planerar skatter och offentliga utgifter","Hur ett företag redovisar sina vinster och kostnader","Privatekonomi handlar om individers och hushålls ekonomi.",1],["b2","b",1,"Vad är en budget?","En plan över förväntade inkomster och utgifter","En lista över alla fakturor som redan betalats","En redovisning av skatten under det gångna året","Budgeten hjälper oss att se om pengarna kommer att räcka.",2],["b3","b",1,"Vad skiljer fasta från rörliga utgifter?","Fasta är svårare att ändra snabbt; rörliga varierar mer med konsumtionen","Fasta betalas alltid årsvis; rörliga alltid månadsvis","Fasta är alla utgifter med faktura; rörliga är alla kortköp","Hyra är ofta fast medan exempelvis matutgifter kan påverkas mer av våra val.",3],["b4","b",1,"Vad betyder bruttolön?","Lön före skatt","Lön efter skatt","Lön efter både skatt och hyra","Bruttolön är före skatt; nettolön efter skatt.",4],["b5","b",1,"Vad betyder nettolön?","Lön efter skatt","Lön före skatt","Lön efter alla hushållets utgifter","Nettolön är lönen efter skatteavdrag.",4],["b6","b",1,"Vad är disponibel inkomst i ekonomisk mening?","Inkomster efter skatt, inklusive eventuella bidrag","Inkomster efter både skatt och fasta utgifter","Bara pengarna som finns på sparkontot","Observera: häftet räknar felaktigt bort fasta utgifter i definitionen. De hör till budgetens utgifter.",6],["b7","b",1,"Vad innebär budgetöverskott?","Inkomsterna är större än utgifterna","Utgifterna är större än inkomsterna","De fasta utgifterna är större än de rörliga","Ett överskott innebär pengar kvar efter utgifterna.",7],["b8","b",1,"Vad innebär budgetunderskott?","Utgifterna är större än inkomsterna","Inkomsterna är större än utgifterna","Utgifterna är lika stora som inkomsterna","Underskott behöver hanteras med lägre utgifter eller högre inkomster.",8],["b9","b",2,"En person får 25 000 kr före skatt och betalar 4 988 kr i skatt. Vad blir nettolönen?","20 012 kr","19 988 kr","29 988 kr","25 000 − 4 988 = 20 012 kr.",4],["b10","b",2,"Vad innebär att deklarera?","Att lämna och kontrollera uppgifter om inkomster och skatt till Skatteverket","Att ansöka om att slippa betala skatt på lönen","Att bestämma vilken kommunalskatt som ska gälla","Deklarationen används för att fastställa rätt skatt.",9],["b11","b",2,"Vad händer om man har betalat för mycket skatt under året?","Man kan få skatteåterbäring","Man måste betala kvarskatt","Bruttolönen höjs automatiskt nästa år","Skatteåterbäring är pengar som återbetalas efter slutlig skatteberäkning.",9],["b12","b",2,"Bea har 14 500 kr efter skatt och utgifter på 15 100 kr. Vad visar budgeten?","Underskott på 600 kr","Överskott på 600 kr","Underskott på 1 500 kr","14 500 − 15 100 = −600 kr.",8]]);
Q.push(...[["f1","f",1,"Vad är en faktura?","En räkning som visar vad som ska betalas och när","Ett kvitto på att betalningen redan är gjord","En ansökan om ett lån från banken","En faktura innehåller bland annat belopp och förfallodatum.",10],["f2","f",1,"Vad betyder OCR-nummer?","Referensnumret som kopplar betalningen till rätt faktura","Numret som anger vilket bankkonto som tar emot pengarna","Datumet när betalningen senast måste göras","OCR används för att identifiera rätt faktura.",11],["f3","f",1,"Vad är förfallodatum?","Sista dagen en faktura ska vara betald","Dagen när fakturan skapades","Dagen när ett inkassokrav skickas","Förfallodatum är betalningens sista dag.",11],["f4","f",1,"Vad används bankgiro eller plusgiro till?","Att ange vart betalningen ska skickas","Att identifiera vilken faktura betalningen avser","Att visa hur stor påminnelseavgiften är","Gironumret identifierar betalningsmottagaren.",11],["f5","f",1,"Vad innebär autogiro?","En betalning dras automatiskt från kontot efter medgivande","Man måste godkänna och skriva in OCR vid varje betalning","Banken garanterar betalningen även utan pengar på kontot","Autogiro kräver att det finns pengar på kontot.",12],["f6","f",1,"Vad är självrisk?","Den del av en ersättningsbar skada man själv betalar","Den återkommande avgiften för att ha en försäkring","Det högsta belopp försäkringsbolaget får betala ut","Självrisk betalas vid skada enligt villkoren.",15],["f7","f",2,"Vilken ordning kan en obetald faktura leda till?","Påminnelse, inkasso och eventuellt Kronofogden","Inkasso, skatteåterbäring och därefter påminnelse","Kronofogden, påminnelse och sedan automatisk skuldavskrivning","Obetalda skulder kan ge extra avgifter och ibland utmätning eller anmärkning.",12],["f8","f",2,"Du får en faktura för något du inte beställt. Vad är bäst?","Bestrida fakturan och spara dokumentation","Betala den direkt och hoppas få tillbaka pengarna","Ignorera den även om krav fortsätter komma","Felaktiga fakturor ska bestridas, inte bara ignoreras.",12],["f9","f",2,"Vad skiljer offentliga och privata försäkringar i häftet?","Offentliga finansieras med skatt; privata genom försäkringspremier","Offentliga tecknas alltid individuellt; privata betalas via kommunalskatt","Offentliga gäller bara saker; privata bara sjukdom","Offentlig socialförsäkring finansieras gemensamt, privat försäkring via avtal.",13],["f10","f",2,"En datorreparation kostar 2 000 kr och självrisken är 1 500 kr. Vad betalar försäkringen om skadan omfattas?","500 kr","1 500 kr","2 000 kr","2 000 − 1 500 = 500 kr.",15],["f11","f",2,"Vilken försäkring skyddar normalt hem och ägodelar vid exempelvis brand?","Hemförsäkring","Livförsäkring","Trafikförsäkring","Hemförsäkringen kan ersätta skador på egendom enligt villkoren.",14],["f12","f",2,"Vilken försäkring kan ge ersättning till efterlevande vid dödsfall?","Livförsäkring","Hemförsäkring","Djurförsäkring","Livförsäkring kan ge ersättning till efterlevande.",14]]);
Q.push(...[["l1","l",1,"Vad är ränta på ett lån?","Kostnaden för att använda lånade pengar","Den del av skulden som betalas tillbaka","Den kontantinsats som betalas vid köpet","Ränta är kostnaden för lånet.",16],["l2","l",1,"Vad betyder amortering?","Att betala av själva låneskulden","Att betala räntan till banken","Att betala bankens uppläggningsavgift","Amortering minskar kvarvarande skuld.",19],["l3","l",1,"Vad är effektiv ränta?","Ett jämförelsemått som tar hänsyn till ränta och relevanta avgifter","Samma sak som nominell ränta utan avgifter","Det belopp man amorterar varje månad","Effektiv ränta visar årlig lånekostnad inklusive relevanta avgifter.",18],["l4","l",1,"Vad innebär det att vara borgensman?","Att kunna bli betalningsansvarig om låntagaren inte betalar","Att automatiskt få äganderätt till det som köps","Att garantera att banken aldrig tar ut ränta","Borgen kan innebära ett stort ekonomiskt ansvar.",22],["l5","l",1,"Vad betyder köp på kredit?","Att få varan nu och betala senare","Att betala innan varan levereras","Att alltid betala med kontanter","Kredit innebär uppskjuten betalning och kan medföra avgifter.",21],["l6","l",1,"Vad är säkerhet för ett lån?","Egendom långivaren kan ha rätt att ta i anspråk om lånet inte betalas","En garanti för att räntan alltid är noll","En avgift som betalas utöver amorteringen","Säkerhet kan minska långivarens risk.",17],["l7","l",2,"Du betalar 500 kr i amortering och 200 kr i ränta. Hur mycket minskar skulden?","500 kr","700 kr","200 kr","Bara amorteringen minskar skulden.",19],["l8","l",2,"Ett lån på 10 000 kr har 12 % årsränta. Vad kostar räntan för ett år om skulden är oförändrad och inga avgifter finns?","1 200 kr","120 kr","12 000 kr","10 000 × 0,12 = 1 200 kr.",16],["l9","l",2,"Två lån har samma belopp och löptid. Ett har lägre nominell ränta men högre avgifter. Vad bör jämföras?","Effektiv ränta och total återbetalning","Enbart nominell ränta","Enbart hur snabbt pengarna betalas ut","Avgifter kan göra lånet med lägre nominell ränta dyrare.",18],["l10","l",2,"Varför kan ett lån med säkerhet ibland få lägre ränta?","Långivarens risk kan bli lägre","Amorteringen upphör automatiskt","Långivaren behöver inte göra kreditprövning","Säkerhet kan minska risken men tar inte bort kreditprövning.",17],["l11","l",2,"Vilket lån är särskilt kopplat till studier via CSN?","Studielån","Bolån","Billån","Häftet tar upp studielån, bolån, billån och snabblån.",20],["l12","l",2,"Vad bör man särskilt tänka på vid snabblån?","Effektiv ränta, avgifter och om man kan betala tillbaka","Att snabblån alltid har lägre ränta eftersom säkerhet saknas","Att snabblån aldrig kräver kreditprövning och därför är riskfria","Snabblån kan bli dyra; häftets påstående om att kreditprövning saknas är missvisande.",20]]);
Q.push(...[["s1","s",1,"Vad är målsparande?","Att spara till ett bestämt framtida köp eller mål","Att bara spara till oförutsedda utgifter","Att låna pengar till ett planerat köp","Målsparande kan vara till resa eller moped.",23],["s2","s",1,"Vad är buffertsparande?","Att spara för oväntade utgifter eller ekonomiska problem","Att spara till en bestämd semester","Att köpa aktier i ett enda företag","En buffert hjälper vid oförutsedda utgifter.",23],["s3","s",1,"Vad innebär det att äga en aktie?","Att äga en andel i ett företag","Att låna ut pengar till staten med fast återbetalning","Att ha ett bankkonto med fast ränta","En aktie är en ägarandel i ett företag.",24],["s4","s",1,"Vad är en obligation?","Ett värdepapper där man lånar ut pengar till en utgivare","En ägarandel i ett företag","Ett sparkonto med insättningsgaranti","Obligationer är i grunden skuldebrev.",24],["s5","s",1,"Vad är en fond?","En samling värdepapper som förvaltas enligt en viss inriktning","En enskild aktie med garanterad utdelning","Ett vanligt sparkonto som alltid är bundet","Fonder kan innehålla aktier eller andra värdepapper.",24],["s6","s",1,"Vad är sparränta?","Ersättning banken kan betala för pengar på ett sparkonto","Den del av ett lån som betalas tillbaka","En avgift som alltid betalas för att äga aktier","Sparränta är ersättning på insatta pengar.",24],["s7","s",2,"Varför passar ett lättillgängligt sparkonto ofta för buffertsparande?","Pengarna kan tas ut snabbt och risken är vanligtvis låg","Aktiekursen är garanterad att stiga varje månad","Pengarna är alltid låsta i flera år","Buffert ska finnas tillgänglig vid oväntade utgifter.",23],["s8","s",2,"Vad är en viktig nackdel med ett bundet sparkonto?","Pengarna kan vara svåra eller dyra att ta ut i förtid","Räntan är alltid lägre än på obundet konto","Kontot kan aldrig omfattas av insättningsgaranti","Bindning kan ge högre ränta men sämre tillgänglighet.",24],["s9","s",2,"Varför kan en fond med många olika aktier minska risken jämfört med en enda aktie?","Risken sprids mellan flera företag","Varje aktie i fonden garanteras av staten","Fondens värde kan aldrig minska","Riskspridning minskar företagsspecifik risk men inte all risk.",24],["s10","s",2,"Sparräntan är 2 % och inflationen 4 %. Vad händer ungefär med köpkraften efter ett år?","Den minskar trots att saldot ökar","Den ökar med ungefär 2 %","Den är oförändrad eftersom räntan är positiv","Priserna stiger snabbare än sparpengarna växer.",24],["s11","s",2,"Vilket påstående om aktier och fonder är mest korrekt?","Båda kan falla i värde; fonder kan sprida risken över flera innehav","Aktier kan falla men fonder är alltid garanterade","Fonder kan falla men enskilda aktier kan aldrig bli värdelösa","Både aktier och fonder har risk; riskspridning ger ingen garanti.",24],["s12","s",2,"Olle behöver pengar till en mobilreparation om två veckor. Vad bör väga tyngst i valet av sparform?","Tillgänglighet och låg risk för värdefall","Högsta möjliga historiska avkastning","Lång bindningstid med möjlighet till bonus","Kort spartid kräver att pengarna är tillgängliga.",23]]);
Q.push(...[["b13","b",2,"Vilka faktorer kan påverka hur mycket skatt som dras på en lön?","Inkomstens storlek, inkomsttyp och var personen bor","Bara antalet timmar personen arbetar","Bara om personen betalar hyra eller äger bostad","Skatt beror på flera förhållanden; det är inte alltid exakt 30 procent.",5],["l13","l",2,"Vilka villkor kan en långivare kontrollera innan ett lån beviljas?","Ålder, betalningsförmåga, kreditvärdighet och ibland säkerhet","Bara om personen har en borgensman","Bara om låntagaren har ett bankkort","Långivaren behöver bedöma återbetalningsförmågan. Fast anställning är inte alltid ett absolut krav.",17],["l14","l",2,"Vilka fyra lånetyper tar häftet särskilt upp?","Bolån, studielån, billån och snabblån","Bolån, privat pensionssparande, aktier och studielån","Bolån, studielån, sparkonto och fondlån","De fyra lånetyperna i häftet är bolån, studielån, billån och snabblån.",20],["s13","s",2,"Vilka fyra sparformer tas upp i jämförelsen i häftet?","Spargris, sparkonto, aktier och fonder","Spargris, bolån, kreditkort och fonder","Sparkonto, billån, aktier och autogiro","Häftet tar även upp obligationer, men jämför dessa fyra vanliga former.",24],["f13","f",2,"Vilken försäkring är särskilt kopplad till skador du orsakar andra i trafiken med en bil?","Trafikförsäkring","Hemförsäkring","Livförsäkring","Trafikförsäkring är obligatorisk för trafikförsäkringspliktiga fordon och ersätter bland annat personskador och skador på andras egendom.",14],["b14","b",2,"Vilket påstående om disponibel inkomst och budget är korrekt?","Först beräknas inkomsten efter skatt; sedan dras utgifterna av i budgeten","Fasta utgifter dras alltid av innan disponibel inkomst beräknas","Disponibel inkomst är alltid exakt samma sak som sparande","Häftets formel blandar ihop disponibel inkomst och pengar kvar efter fasta utgifter.",6]]);

const AREAS={b:{name:"Budget och skatt",icon:"▦",pages:"Sidor 1–3",study:"Fråga 1–9"},f:{name:"Fakturor och försäkring",icon:"▤",pages:"Sidor 4–6",study:"Fråga 10–15"},l:{name:"Lån och kredit",icon:"%",pages:"Sidor 6–8",study:"Fråga 16–22"},s:{name:"Spara och investera",icon:"◈",pages:"Sidor 8–10",study:"Fråga 23–24"}};
const KEY="olle-hkk-ht26-v1", $=id=>document.getElementById(id);
const escapeHTML=v=>String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const shuffle=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const btn=(label,action,cls="")=>'<button class="'+cls+'" onclick="'+action.replace(/"/g,"&quot;")+'">'+escapeHTML(label)+'</button>';
const empty=()=>({v:1,results:{},sessions:0,missions:{},exams:[],currentExam:null});
let state;try{state=JSON.parse(localStorage.getItem(KEY)||"null");if(!state||state.v!==1||!state.results||!state.missions)state=empty()}catch(e){state=empty()}
let saved=true;
function save(){try{const val=JSON.stringify(state);localStorage.setItem(KEY,val);saved=localStorage.getItem(KEY)===val;return saved}catch(e){saved=false;return false}}
function stats(area){const qs=Q.filter(q=>q[1]===area),done=qs.filter(q=>state.results[q[0]]),strong=qs.filter(q=>{const r=state.results[q[0]];return r&&r.right>=2&&r.last});return {done:done.length,strong:strong.length,lastCorrect:done.filter(q=>state.results[q[0]].last).length,total:qs.length}}
const ready=area=>{const s=stats(area);return s.done>=8&&s.lastCorrect>=6};
const allReady=()=>Object.keys(AREAS).every(ready);
function reportText(){const lines=["OLLES HKK – PRIVATEKONOMI","Uttagen: "+new Date().toLocaleString("sv-SE"),""];for(const a of Object.keys(AREAS)){const s=stats(a);lines.push(AREAS[a].name+": "+s.done+"/"+s.total+" frågor tränade, "+s.strong+" starka minnen, "+(state.missions[a]?"minispel genomfört":"minispel ej genomfört"))}lines.push("","Genomförda träningsprov: "+state.exams.length);for(const e of state.exams.slice(-3))lines.push(e.date+": "+e.right+"/"+e.total+" rätt");lines.push("","Frågor att repetera:");for(const q of Q.filter(q=>state.results[q[0]]&&!state.results[q[0]].last).slice(0,20))lines.push("• "+q[3]);lines.push("","Rapporten är en ögonblicksbild. Resultat sparas på denna enhet och är inte betyg.");return lines.join("\n")}
function report(){const total=Q.filter(q=>state.results[q[0]]).length;const strong=Q.filter(q=>{const r=state.results[q[0]];return r&&r.right>=2&&r.last}).length;$("app").innerHTML='<section class="panel"><div class="kicker">Progressrapport</div><h1>Så går det för Olle</h1><div class="stats"><div class="stat"><strong>'+total+'/'+Q.length+'</strong><span>Tränade frågor</span></div><div class="stat"><strong>'+strong+'</strong><span>Starka minnen</span></div><div class="stat"><strong>'+state.exams.length+'</strong><span>Träningsprov</span></div></div>'+Object.keys(AREAS).map(a=>{const s=stats(a);return '<div class="resultline"><b>'+AREAS[a].name+'</b><p>'+s.done+'/'+s.total+' tränade · '+s.strong+' starka · '+(state.missions[a]?"Uppdrag klart":"Uppdrag ej klart")+'</p></div>'}).join("")+'<div class="btnrow">'+btn("Kopiera rapport","copyReport()","primary")+btn("Tillbaka","home()")+'</div><p id="copied" class="muted"></p></section>'}

let session=[],pos=0,slot=[],correct=0,wrong=0,seenWrong=new Set(),trainArea="";
function positions(n){const a=[];while(a.length<n)a.push(...shuffle([0,1,2]));return a.slice(0,n)}
function pick(area){const list=Q.filter(q=>q[1]===area).map(q=>{const r=state.results[q[0]];return {q,w:!r?9:r.last?Math.max(1,4-r.right):10+2*r.wrong}}).sort((a,b)=>b.w-a.w);const chosen=[];for(const stage of [1,2]){const group=list.filter(x=>x.q[2]===stage).sort((a,b)=>b.w-a.w+Math.random()*1.5).slice(0,stage===1?7:5);chosen.push(...group.map(x=>x.q))}return shuffle(chosen)}
function startTrain(a){trainArea=a;session=pick(a).map(q=>({q,retry:false}));pos=0;correct=0;wrong=0;seenWrong=new Set();slot=positions(36);renderTrain()}
function currentQ(){return session[pos]?.q}
function renderTrain(){if(pos>=session.length){finishTrain();return}const q=currentQ(),s=stats(trainArea);$("app").innerHTML='<section class="panel"><div class="kicker">'+AREAS[trainArea].name+' · '+(q[2]===1?"Återkalla":"Förstå och använda")+'</div><div class="row"><small>Fråga '+(pos+1)+' av '+session.length+'</small><small>'+correct+' rätt</small></div><div class="bar"><div style="width:'+Math.round(pos/session.length*100)+'%"></div></div><div class="question">'+escapeHTML(q[3])+'</div><div class="think">'+(q[2]===1?"<b>Tänk först.</b> Försök säga svaret innan alternativen visas.":"<b>Jämför alternativen.</b> Välj den mest korrekta förklaringen.")+'</div><div id="answer">'+(q[2]===1?btn("Jag har tänkt – visa alternativ","showTrainChoices()","primary wide"):"")+'</div><div class="note">Koppling: instuderingsfråga '+q[8]+'. Häftets kapitel: '+AREAS[trainArea].pages+'.</div></section><div class="btnrow">'+btn("Avsluta passet","home()")+btn("Progressrapport","report()")+'</div>';if(q[2]!==1)showTrainChoices();window.scrollTo(0,0)}
function showTrainChoices(){const q=currentQ();if(!q||!$("answer")||$("answer").innerHTML.includes('class="option"'))return;const answers=shuffle([q[4],q[5],q[6]]);const rightIndex=slot[pos%slot.length];const others=answers.filter(x=>x!==q[4]);others.splice(rightIndex,0,q[4]);$("answer").innerHTML='<div class="stack">'+others.map((x,i)=>'<button class="option" data-answer="'+escapeHTML(x)+'" onclick="chooseTrain('+i+')"><b>'+(i+1)+'</b>'+escapeHTML(x)+'</button>').join("")+'</div>'}
function chooseTrain(i){const bs=[...document.querySelectorAll(".option")];if(bs.length!==3||bs.some(b=>b.disabled))return;const q=currentQ(),answer=bs[i].getAttribute("data-answer"),ok=answer===q[4];if(ok)correct++;else wrong++;const st=state.results[q[0]]||{right:0,wrong:0,last:false};if(ok)st.right++;else{st.wrong++;if(!seenWrong.has(q[0])){seenWrong.add(q[0]);session.splice(Math.min(pos+3,session.length),0,{q,retry:true})}}st.last=ok;st.at=Date.now();state.results[q[0]]=st;const didSave=save();bs.forEach((b,j)=>{b.disabled=true;if(b.getAttribute("data-answer")===q[4])b.classList.add("right");else if(i===j)b.classList.add("wrong")});$("answer").insertAdjacentHTML("beforeend",'<div class="feedback '+(ok?"":"bad")+'"><b>'+(ok?"Rätt!":"Inte riktigt – frågan återkommer.")+'</b><p>'+escapeHTML(q[7])+'</p></div><p class="muted">'+(didSave?"✓ Svaret sparat på denna enhet.":"⚠ Kunde inte spara svaret.")+'</p>'+btn("Nästa fråga →","nextTrain()","primary wide"))}
function nextTrain(){pos++;renderTrain()}

function examChoices(i){const q=examItem(i),a=q.wrong.slice();if(i%2)a.reverse();a.splice(state.currentExam.slots[i],0,q.correct);return a}
function renderExam(){if(!state.currentExam){home();return}const e=state.currentExam,i=examIndex,q=examItem(i),value=e.answers[i],answered=Object.keys(e.answers).length;const recall=q.stage===1&&value===undefined;
$("app").innerHTML='<section class="panel"><div class="kicker">Träna inför prov · Fråga '+(i+1)+' / '+EXAM.length+'</div><div class="row"><small>Instuderingsfråga '+q.study+'</small><small>'+answered+' av '+EXAM.length+' besvarade</small></div><div class="bar"><div style="width:'+Math.round(answered/EXAM.length*100)+'%"></div></div><div class="question">'+escapeHTML(q.prompt)+'</div><div class="think">'+(recall?"Försök först svara ur minnet. Visa sedan alternativen.":q.stage===1?"Ditt svar är registrerat. Du kan ändra det före inlämning.":"Jämför svaren och välj det mest korrekta.")+'</div><div id="examOptions">'+(recall?btn("Visa alternativen","showExamChoices()","primary wide"):"")+'</div><div class="btnrow">'+btn("← Föregående","examGo("+Math.max(0,i-1)+")")+(i<EXAM.length-1?btn("Nästa →","examGo("+Math.min(EXAM.length-1,i+1)+")","primary"):btn("Lämna in provet","submitExam()","primary"))+'</div><div class="examnav">'+EXAM.map((x,j)=>'<button class="'+(j===i?"active":e.answers.hasOwnProperty(j)?"done":"")+'" onclick="examGo('+j+')">'+(j+1)+'</button>').join("")+'</div><div class="note">Ingen facitvisning förrän provet är inlämnat. Svaren sparas efter varje val.</div></section>';if(!recall)showExamChoices();window.scrollTo(0,0)}
function showExamChoices(){const e=state.currentExam;if(!e||!$("examOptions")||$("examOptions").innerHTML.includes('class="option"'))return;const arr=examChoices(examIndex);$("examOptions").innerHTML='<div class="stack">'+arr.map((v,i)=>'<button class="option '+(e.answers[examIndex]===v?"chosen":"")+'" onclick="chooseExam('+i+')" data-answer="'+escapeHTML(v)+'"><b>'+(i+1)+'</b>'+escapeHTML(v)+'</button>').join("")+'</div>'}
function chooseExam(i){const bs=[...document.querySelectorAll(".option")];if(!state.currentExam||bs.length!==3)return;const v=bs[i].getAttribute("data-answer");state.currentExam.answers[examIndex]=v;save();bs.forEach((b,j)=>b.classList.toggle("chosen",i===j));const n=Object.keys(state.currentExam.answers).length;const text=$("app").querySelector(".row small:last-child");if(text)text.textContent=n+" av "+EXAM.length+" besvarade"}
function examGo(i){if(!state.currentExam)return;examIndex=Math.max(0,Math.min(EXAM.length-1,i));renderExam()}
function submitExam(){if(!state.currentExam)return;const e=state.currentExam;const missing=EXAM.findIndex((_,i)=>!e.answers.hasOwnProperty(i));if(missing>=0){examIndex=missing;renderExam();window.alert("Besvara alla frågor innan du lämnar in. Du kom till den första obesvarade.");return}let right=0;const byArea={b:{ok:0,total:0},f:{ok:0,total:0},l:{ok:0,total:0},s:{ok:0,total:0}};const misses=[];for(let i=0;i<EXAM.length;i++){const q=examItem(i),ok=e.answers[i]===q.correct;byArea[q.area].total++;if(ok){right++;byArea[q.area].ok++}else misses.push({q:q.prompt,answer:e.answers[i],correct:q.correct,why:q.why,study:q.study})}
const result={date:new Date().toLocaleString("sv-SE"),right,total:EXAM.length,byArea,misses};state.exams.push(result);state.exams=state.exams.slice(-8);state.currentExam=null;save();renderExamResult(result)}
function renderExamResult(r){$("app").innerHTML='<section class="panel"><div class="kicker">Träningsprov inlämnat</div><h1>Din provrapport</h1><div class="money">'+r.right+' / '+r.total+' rätt</div><p>Det här visar vilka frågor du kunde välja rätt svar på. Det är <b>inte ett betyg</b> och visar inte automatiskt hur utvecklade dina egna resonemang är.</p><div class="grid">'+Object.keys(AREAS).map(a=>'<div class="tile"><b>'+AREAS[a].name+'</b><p>'+r.byArea[a].ok+' av '+r.byArea[a].total+' rätt</p></div>').join("")+'</div></section><section class="panel"><h2>Det här behöver repeteras</h2>'+(r.misses.length?r.misses.map((m,i)=>'<div class="resultline"><div class="label">INSTUDERINGSFRÅGA '+m.study+'</div><b>'+escapeHTML(m.q)+'</b><p><b>Rätt svar:</b> '+escapeHTML(m.correct)+'</p><p>'+escapeHTML(m.why)+'</p></div>').join(""):"<p>Alla flervalsfrågor blev rätt. Testa nu att förklara begreppen med egna ord.</p>")+'</section><section class="panel"><h2>Tre muntliga provfrågor</h2><p>För att träna mer utvecklade resonemang: försök svara muntligt med <b>val → orsak → konsekvens</b>. Ingen skrivning behövs.</p><div class="resultline"><b>1. Budget</b><p>En familj går minus varje månad. Jämför två möjliga lösningar och förklara vilka följder de kan få.</p></div><div class="resultline"><b>2. Kredit</b><p>En mobil kan betalas direkt eller på avbetalning. Vad bör man undersöka och varför?</p></div><div class="resultline"><b>3. Sparande</b><p>Jämför sparkonto och en bred aktiefond för en buffert som kan behövas snart. Vilka fördelar och risker finns?</p></div><div class="note">Bedömning enligt HKK åk 9 omfattar bland annat att beskriva faktorer och beslut som påverkar privatekonomin samt värdera konsekvenser. Flervalsresultat kan inte ensamt bedöma utvecklingen i elevens resonemang.</div><div class="btnrow">'+btn("Träna mer","home()","primary")+btn("Progressrapport","report()")+'</div></section>'}
home();
</script></body></html>
