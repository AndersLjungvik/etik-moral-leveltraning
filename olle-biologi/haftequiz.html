nsform:scale(.99)}.choice .letter{flex:none;background:#10293b;color:var(--mint);width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:900}.choice.correct{background:#184b3f;border-color:#77dfb3}.choice.wrong{background:#572f39;border-color:#ffaaa1}.choice:disabled{opacity:1}.muted{color:var(--sub)}.mini{font-size:.85rem}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#20394e;padding:12px 9px;border-radius:13px;text-align:center}.stat strong{display:block;color:var(--mint);font-size:1.5rem}.stat span{font-size:.75rem;color:var(--sub)}.bar{height:9px;border-radius:10px;background:#345066;overflow:hidden;margin:13px 0}.fill{height:100%;background:var(--mint);transition:width .2s}.pill{display:inline-block;font-size:.76rem;padding:5px 10px;border-radius:99px;border:1px solid #54748c;color:var(--sub);margin:0 6px 9px 0}.qtitle{font-size:clamp(1.25rem,5.2vw,1.65rem);font-weight:800;line-height:1.34;margin:16px 0 23px}.think{border-left:3px solid var(--gold);padding:10px 13px;background:#27384a;border-radius:0 12px 12px 0;margin:0 0 20px;color:#f1e8cb}.feedback{padding:16px;border-radius:14px;margin-top:15px}.feedback.good{background:#164238;border:1px solid #529f82}.feedback.bad{background:#4b2e3a;border:1px solid #a76a72}.feedback strong{display:block;margin-bottom:7px}.feedback p{color:var(--text);margin:0}.area{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #3a5265;padding:12px 0}.area:last-child{border:0}.smallnote{font-size:.84rem;margin:15px 0}.hidden{display:none!important}.success{color:var(--mint)}.warning{color:var(--gold)}.foot{font-size:.79rem;color:var(--sub);margin-top:26px;text-align:center}@media(max-width:370px){.two{grid-template-columns:1fr}.stats{gap:5px}.stat{padding:9px 4px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

const CARDS=[{"id":"g1","area":"DNA & gener","kind":"minne","q":"Vad betyder genetik?","a":"Läran om ärftlighet","wrong":["Läran om vädret","Läran om matsmältningen"],"why":"Genetik handlar om hur egenskaper ärvs och varierar.","priority":1},{"id":"g2","area":"DNA & gener","kind":"minne","q":"Vad är en gen?","a":"Ett avsnitt av DNA","wrong":["En hel kromosom","Ett färdigt protein"],"why":"En gen är en del av DNA som innehåller information, ofta för att tillverka ett RNA eller protein.","priority":1},{"id":"g3","area":"DNA & gener","kind":"minne","q":"Vad består en kromosom av?","a":"DNA som är packat tillsammans med proteiner","wrong":["Bara protein","Enbart ribosomer"],"why":"Kromosomer innehåller DNA och proteiner som hjälper till att packa DNA.","priority":2},{"id":"g4","area":"DNA & gener","kind":"minne","q":"Vilka baser passar ihop i DNA?","a":"A med T och C med G","wrong":["A med C och T med G","A med G och C med T"],"why":"Basparen håller ihop DNA:s två strängar.","priority":2},{"id":"g5","area":"DNA & gener","kind":"resonemang","q":"Olle kan baserna A, T, C och G. Vad saknas för att beskriva DNA:s form?","a":"Två strängar som bildar en dubbelspiral","wrong":["Att DNA är en ensam rak sträng","Att DNA bara finns i ribosomer"],"why":"DNA är normalt en dubbelhelix: två strängar med parade baser.","priority":3},{"id":"g6","area":"DNA & gener","kind":"minne","q":"Vad gör ribosomer?","a":"Sätter ihop aminosyror till proteiner","wrong":["Halverar kromosomantalet","Skapar nya kromosomer från ingenting"],"why":"Ribosomer använder information från mRNA när de bygger proteiner.","priority":1},{"id":"g7","area":"DNA & gener","kind":"resonemang","q":"Hur kan en gen bidra till att ett protein bildas?","a":"DNA-information kopieras till RNA som ribosomen använder","wrong":["Genen flyttas hel till en ribosom och blir ett protein","Proteinet tillverkar först genen"],"why":"Det förenklade sambandet är DNA → RNA → protein.","priority":3},{"id":"g8","area":"DNA & gener","kind":"minne","q":"Ungefär hur många proteinkodande gener har människan?","a":"Omkring 20 000","wrong":["Omkring 200","Omkring 2 miljoner"],"why":"Läromedel kan ange ungefär 20 000–22 000. Exakt uppskattning beror på hur gener räknas.","priority":1},{"id":"g9","area":"DNA & gener","kind":"resonemang","q":"Vad innebär den genetiska koden mer exakt?","a":"Tre baser i RNA anger en aminosyra eller stoppsignal","wrong":["Varje kromosom anger en färdig kroppsdel","Alla gener ger alltid exakt samma protein"],"why":"Kodens kodon består av tre RNA-baser som används vid proteinsyntesen.","priority":3},{"id":"c1","area":"Celldelning","kind":"minne","q":"Hur många kromosomer finns normalt i en mänsklig kroppscell?","a":"46","wrong":["23","92"],"why":"De 46 kromosomerna är normalt ordnade i 23 par.","priority":1},{"id":"c2","area":"Celldelning","kind":"minne","q":"Hur många kromosomer finns normalt i en äggcell eller spermie?","a":"23","wrong":["46","12"],"why":"Könsceller har normalt 23 kromosomer.","priority":1},{"id":"c3","area":"Celldelning","kind":"minne","q":"Vad heter celldelningen som bildar könsceller?","a":"Meios","wrong":["Mitos","Befruktning"],"why":"Meios halverar kromosomantalet.","priority":1},{"id":"c4","area":"Celldelning","kind":"resonemang","q":"Vad måste ske med DNA innan en vanlig celldelning?","a":"DNA kopieras så att båda dottercellerna kan få en uppsättning","wrong":["DNA försvinner för att sedan skapas på nytt","DNA halveras permanent i båda cellerna"],"why":"DNA replikeras före mitosen; sedan fördelas kromosomerna.","priority":3},{"id":"c5","area":"Celldelning","kind":"resonemang","q":"En cell med 46 kromosomer delar sig genom mitos. Vad blir resultatet normalt?","a":"Två dotterceller med 46 kromosomer var","wrong":["Två dotterceller med 23 kromosomer var","En enda cell med 92 kromosomer"],"why":"Mitos bevarar normalt kromosomantalet och ger två dotterceller.","priority":3},{"id":"c6","area":"Celldelning","kind":"resonemang","q":"Varför behövs meios inför befruktning?","a":"Annars skulle kromosomantalet normalt fördubblas varje generation","wrong":["Annars skulle alla gener försvinna","Annars skulle äggceller få fler ribosomer"],"why":"Meios ger 23 kromosomer i varje könscell; 23 + 23 blir normalt 46.","priority":2},{"id":"c7","area":"Celldelning","kind":"resonemang","q":"Vilken könscell avgör oftast om ett embryo får XX eller XY?","a":"Spermien, som kan bidra med X eller Y","wrong":["Äggcellen, som normalt bidrar med Y","Ingen av könscellerna bidrar med könskromosomer"],"why":"Ägget bidrar normalt med X; spermien med X eller Y. Biologisk könsutveckling kan vara mer komplex.","priority":3},{"id":"a1","area":"Ärftlighet","kind":"minne","q":"Vad betyder dominant anlag i ett enkelt arvsexempel?","a":"Det kommer till uttryck även med en enda kopia","wrong":["Det är alltid vanligare i befolkningen","Det är alltid mer sannolikt att ärvas"],"why":"Dominans beskriver uttryck, inte hur ofta ett anlag ärvs.","priority":3},{"id":"a2","area":"Ärftlighet","kind":"minne","q":"Vad betyder recessivt anlag i ett enkelt arvsexempel?","a":"Det syns normalt först när båda allelerna är recessiva","wrong":["Det är ett anlag som nästan aldrig ärvs","Det är ett anlag som alltid försvinner"],"why":"Vid fullständig dominans kan ett recessivt anlag bäras utan att synas.","priority":3},{"id":"a3","area":"Ärftlighet","kind":"resonemang","q":"Två föräldrar är Aa. Hur stor chans har ett barn att få aa?","a":"25 procent","wrong":["50 procent","75 procent"],"why":"Möjliga kombinationer: AA, Aa, Aa och aa.","priority":2},{"id":"a4","area":"Ärftlighet","kind":"resonemang","q":"En förälder har Aa och den andra aa. Hur stor chans är det för aa?","a":"50 procent","wrong":["25 procent","100 procent"],"why":"Kombinationerna blir Aa och aa med lika stor sannolikhet.","priority":2},{"id":"a5","area":"Ärftlighet","kind":"minne","q":"Vad är intermediär nedärvning?","a":"Heterozygoten får en mellanform eftersom ingen allel dominerar helt","wrong":["Två dominanta anlag ger alltid en helt ny art","Det recessiva anlaget försvinner ur DNA"],"why":"Exempel: röd och vit blomma kan ge rosa heterozygot blomma.","priority":3},{"id":"a6","area":"Ärftlighet","kind":"resonemang","q":"Röd blomma RR och vit blomma VV ger rosa RV. Vad visar det?","a":"Intermediär nedärvning","wrong":["Att rött alltid är fullständigt dominant","Att båda föräldrarna har recessiva alleler"],"why":"Ingen av allelerna dominerar helt; heterozygoten blir rosa.","priority":3},{"id":"a7","area":"Ärftlighet","kind":"minne","q":"Vad är Gregor Mendel känd för?","a":"Försök med ärftlighet hos ärtväxter","wrong":["Upptäckten av ribosomer","Teorin om plattektonik"],"why":"Mendel beskrev grundläggande mönster för nedärvning.","priority":1},{"id":"a8","area":"Ärftlighet","kind":"resonemang","q":"Vilket exempel visar en egenskap som påverkas av både arv och miljö?","a":"Muskelstyrka påverkas av gener och träning","wrong":["Blodgrupp ändras när man tränar","En mutation sker alltid när man äter mat"],"why":"Många egenskaper påverkas av både genetiska förutsättningar och miljö.","priority":2},{"id":"a9","area":"Ärftlighet","kind":"resonemang","q":"Vilken egenskap bestäms i regel av ärftliga varianter snarare än träning?","a":"ABO-blodgrupp","wrong":["Kondition efter ett träningsprogram","Solbränna efter en semester"],"why":"ABO-blodgrupp är ett tydligt exempel på ärftlig bestämning.","priority":1},{"id":"m1","area":"Mutationer & kloner","kind":"minne","q":"Vad är en mutation?","a":"En förändring i DNA-sekvensen","wrong":["En vanlig celldelning","Att en individ tränar och blir starkare"],"why":"Mutationer kan uppstå vid DNA-kopiering eller av andra orsaker.","priority":3},{"id":"m2","area":"Mutationer & kloner","kind":"resonemang","q":"Måste en mutation ske just under mitos?","a":"Nej, DNA kan förändras även vid andra tillfällen","wrong":["Ja, mutationer sker bara under mitos","Ja, och varje mutation leder till en ny art"],"why":"Mutationer kan uppstå när DNA kopieras men också genom andra skador och processer.","priority":3},{"id":"m3","area":"Mutationer & kloner","kind":"resonemang","q":"Vilket påstående om mutationer är korrekt?","a":"De kan vara neutrala, skadliga eller gynnsamma","wrong":["Alla mutationer är skadliga","Mutationer uppstår för att kroppen behöver dem"],"why":"Effekten beror på vilken förändring som skett och i vilket sammanhang.","priority":2},{"id":"m4","area":"Mutationer & kloner","kind":"minne","q":"Vad är den vanligaste kromosomförklaringen till Downs syndrom?","a":"En extra kopia av kromosom 21","wrong":["En extra kopia av alla kromosomer","Att alla gener på X-kromosomen saknas"],"why":"Trisomi 21 innebär oftast tre exemplar av kromosom 21.","priority":3},{"id":"m5","area":"Mutationer & kloner","kind":"minne","q":"Vad är en biologisk klon?","a":"En genetiskt identisk eller nästan identisk kopia","wrong":["En individ med dubbelt så många kromosomer","En individ utan DNA"],"why":"Enäggstvillingar är ett exempel på naturlig kloning.","priority":1},{"id":"t1","area":"Genteknik","kind":"minne","q":"Vad innebär insemination?","a":"Spermier förs in i fortplantningsorganen utan samlag","wrong":["Ett befruktat ägg sätts alltid in efter provrörsbefruktning","Man ändrar gener med CRISPR"],"why":"Insemination är inte samma sak som IVF, även om båda är fertilitetsbehandlingar.","priority":3},{"id":"t2","area":"Genteknik","kind":"minne","q":"Vilka mikroorganismer används vid jäsning och syrning?","a":"Jästsvampar och mjölksyrabakterier","wrong":["Bara virus","Bara alger"],"why":"Jäst används bland annat i bröd; mjölksyrabakterier i yoghurt och fil.","priority":3},{"id":"t3","area":"Genteknik","kind":"resonemang","q":"Vad gör man för att få bakterier att producera mänskligt insulin?","a":"För in genetisk information för insulin i bakterier som sedan odlas","wrong":["Delar bara mänskliga celler utan att använda bakterier","Låter bakterierna lära sig tillverka insulin genom träning"],"why":"Bakterier med rätt gen kan tillverka insulinprotein som sedan renas.","priority":3},{"id":"t4","area":"Genteknik","kind":"minne","q":"Vad betyder GMO?","a":"Genetiskt modifierad organism","wrong":["Gen med många organ","Genomgående modern organism"],"why":"En GMO har fått sin arvsmassa förändrad med genteknik.","priority":1},{"id":"t5","area":"Genteknik","kind":"minne","q":"Vad betyder rekombinant DNA (DNA-hybrid)?","a":"DNA som satts ihop av DNA från olika källor","wrong":["DNA som alltid är helt identiskt","DNA som inte innehåller några gener"],"why":"I ett skolboksexempel kan en gen fogas in i en bakterieplasmid.","priority":3},{"id":"t6","area":"Genteknik","kind":"resonemang","q":"Vilken beskrivning av genterapi är bäst?","a":"Man tillför eller förändrar genetisk information i patientens celler för att behandla sjukdom","wrong":["Man byter alltid ut alla gener i kroppens alla celler","Man ändrar gener bara för att få en ny ögonfärg"],"why":"Genterapi kan innebära att gener tillförs, ändras eller regleras; den ersätter inte alltid en gen.","priority":3},{"id":"t7","area":"Genteknik","kind":"minne","q":"Var kan DNA-analyser användas?","a":"I sjukvård, släktskapsutredningar och kriminalteknik","wrong":["Bara för att mäta puls","För att med säkerhet förutsäga alla människors val"],"why":"DNA-analyser används i flera sammanhang men har begränsningar.","priority":1},{"id":"t8","area":"Genteknik","kind":"resonemang","q":"Vilket resonemang om genteknik är mest genomtänkt?","a":"Den kan ge läkemedel och bättre grödor, men risker och etik behöver bedömas","wrong":["All genteknik är alltid helt ofarlig","All genteknik är alltid farlig och utan nytta"],"why":"Ett resonemang väger möjlig nytta mot risker och etiska frågor.","priority":3},{"id":"t9","area":"Genteknik","kind":"resonemang","q":"En odlare väljer varje år de plantor som ger störst skörd och använder deras frön. Vad är det?","a":"Urvalsförädling","wrong":["Genterapi","Insemination"],"why":"Man väljer individer med önskade egenskaper för fortsatt förökning.","priority":2},{"id":"t10","area":"Genteknik","kind":"resonemang","q":"Två växtsorter korsas för att kombinera deras egenskaper. Vad är det?","a":"Korsningsförädling","wrong":["Kloning av en enda planta","DNA-analys"],"why":"Korsning kombinerar genvarianter från två föräldrar.","priority":2},{"id":"r1","area":"Samband","kind":"resonemang","q":"En recessiv allel kan finnas hos någon utan att egenskapen syns. Varför?","a":"En dominant allel kan maskera dess uttryck","wrong":["Den recessiva allelen har lämnat cellen","Recessiva alleler är alltid trasiga"],"why":"Heterozygoten Aa kan bära a utan att få recessiv fenotyp.","priority":3},{"id":"r2","area":"Samband","kind":"resonemang","q":"En mutation uppstår i en hudcell. Vad gäller för barnets arv?","a":"Den ärvs normalt inte av personens framtida barn","wrong":["Den ärvs alltid av alla barn","Den gör alltid personen sjuk"],"why":"Mutationer i kroppsceller förs normalt inte vidare via könsceller.","priority":3},{"id":"r3","area":"Samband","kind":"resonemang","q":"Varför kan två enäggstvillingar bli olika starka?","a":"Miljö och träning påverkar trots mycket lika DNA","wrong":["Deras gener måste vara helt olika från början","Styrka påverkas aldrig av miljön"],"why":"Fenotyp påverkas ofta av både arv och miljö.","priority":2},{"id":"r4","area":"Samband","kind":"resonemang","q":"Varför räcker inte 'jag tycker inte genteknik är farligt' som ett utvecklat svar?","a":"Det saknas skäl, exempel och ett möjligt motargument","wrong":["För att man alltid måste svara ja","För att åsikter aldrig får finnas i biologi"],"why":"Ett resonemang visar varför och tar gärna upp både möjligheter och risker.","priority":3},{"id":"r5","area":"Samband","kind":"resonemang","q":"Vilken ordning beskriver insulinframställning med genteknik?","a":"Insulingen → bakterie med genen → insulinprotein → rening","wrong":["Färdigt insulin → gen försvinner → bakterie","Bakterie utan gen → färdigt insulin utan vidare steg"],"why":"Först förs genetisk information in; därefter odlas producerande celler och proteinet renas.","priority":3}];
const KEY='olles-hafte-retrieval-v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const shuffle=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const fresh=()=>({v:1,stats:{},sessions:0});
let data;try{data=JSON.parse(localStorage.getItem(KEY)||'null');if(!data||data.v!==1||typeof data.stats!=='object')data=fresh()}catch(e){data=fresh()}
let saveOk=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));saveOk=localStorage.getItem(KEY)===JSON.stringify(data);return saveOk}catch(e){saveOk=false;return false}}
let queue=[],position=0,correct=0,wrong=0,mode='focus',slots=[],retries={};
function btn(text,fn,cls){const safeFn=fn.replace(/&/g,'&amp;').replace(/"/g,'&quot;');return '<button type="button" class="btn '+(cls||'primary')+'" onclick="'+safeFn+'">'+text+'</button>'}
function scoreCard(c){const st=data.stats[c.id]||{};return (c.priority*3)+(st.wrong||0)*2-(st.right||0)*1.6+Math.random()*4}
function makeSlots(n){let a=[];while(a.length<n)a.push(...shuffle([0,1,2]));return a.slice(0,n)}
function pickCards(m){let list=CARDS.filter(c=>m!=='reason'||c.kind==='resonemang');if(m==='focus'){const focus=list.filter(c=>c.priority===3).sort((a,b)=>scoreCard(b)-scoreCard(a)).slice(0,8);const others=shuffle(list.filter(c=>!focus.includes(c))).slice(0,4);return shuffle([...focus,...others])}return shuffle(list).slice(0,m==='reason'?10:12)}
function start(m){mode=m;queue=pickCards(m).map(c=>({id:c.id,retry:false}));position=0;correct=0;wrong=0;retries={};slots=makeSlots(32);renderQuestion()}
function current(){return CARDS.find(c=>c.id===queue[position].id)}
function renderHome(){const done=Object.values(data.stats).filter(s=>s.right>=2&&s.last===true).length;const tried=Object.keys(data.stats).length;const totalWrong=Object.values(data.stats).reduce((n,s)=>n+(s.wrong||0),0);
$('app').innerHTML='<section class="hero"><div class="eyebrow">Olles häfte · 3 korta träningspass</div><h1>Kom ihåg. Förstå. Använd.</h1><p>Först försöker du minnas svaret själv. Sedan väljer du ett alternativ. Du behöver inte skriva någonting.</p><span class="pill">Ca 5–7 minuter per pass</span><span class="pill">Frågorna blandas</span><span class="pill">Svåra frågor återkommer</span></section><section class="panel"><h2>Välj träningspass</h2><div class="stack">'+btn('🎯 Träna det du behöver mest','start("focus")','primary wide')+btn('🧠 Resonera och använda','start("reason")','secondary wide')+btn('🔀 Blanda hela häftet','start("mix")','secondary wide')+'</div></section><section class="panel"><h2>Dina framsteg</h2><div class="stats"><div class="stat"><strong>'+tried+'</strong><span>Olika frågor tränade</span></div><div class="stat"><strong>'+done+'</strong><span>Starka minnen</span></div><div class="stat"><strong>'+totalWrong+'</strong><span>Fel att lära av</span></div></div><p class="smallnote">Ett starkt minne betyder minst två korrekta svar och rätt vid senaste försöket. Det är ett träningsmått, inte ett provbetyg.</p>'+btn('Se och dela rapport','renderReport()','outline wide')+'</section>'}
function renderQuestion(){if(position>=queue.length){finish();return}const c=current();const n=position+1;const total=queue.length;const phase=c.kind==='resonemang'?'RESONERA':'MINNS';$('app').innerHTML='<section class="panel"><div class="eyebrow">'+phase+' · '+esc(c.area)+'</div><div class="area"><span>Fråga '+n+' av '+total+'</span><span>'+(queue[position].retry?'↻ Repetition':'✓ '+correct+' rätt')+'</span></div><div class="bar"><div class="fill" style="width:'+Math.round((position/total)*100)+'%"></div></div><div class="qtitle">'+esc(c.q)+'</div><div class="think"><strong>Tänk först.</strong> Försök säga svaret tyst eller högt innan du tittar på alternativen.</div><div id="answerArea">'+btn('Jag har tänkt – visa alternativen','showChoices()','primary wide')+'</div></section><div class="two">'+btn('← Avsluta passet','confirmExit()','outline wide')+btn('📊 Framsteg','renderReport()','secondary wide')+'</div>';window.scrollTo(0,0)}
function showChoices(){const c=current();const others=shuffle(c.wrong);const p=slots[position%slots.length];others.splice(p,0,c.a);const html='<div class="stack">'+others.map((answer,i)=>'<button type="button" class="choice" data-answer="'+esc(answer)+'" onclick="choose('+i+')"><span class="letter">'+(i+1)+'</span><span>'+esc(answer)+'</span></button>').join('')+'</div><p class="smallnote">Välj det svar som stämmer bäst. Bara ett alternativ är rätt.</p>'; $('answerArea').innerHTML=html}
function choose(i){const c=current(),buttons=Array.from(document.querySelectorAll('.choice'));if(!buttons.length||buttons.some(b=>b.disabled))return;const chosen=buttons[i].getAttribute('data-answer');const ok=chosen===c.a;const st=data.stats[c.id]||{right:0,wrong:0,streak:0,last:false};if(ok){correct++;st.right++;st.streak++}else{wrong++;st.wrong++;st.streak=0;if(!retries[c.id]){retries[c.id]=true;const target=Math.min(position+4,queue.length);queue.splice(target,0,{id:c.id,retry:true})}}st.last=ok;st.at=Date.now();data.stats[c.id]=st;const saved=save();buttons.forEach((b,j)=>{b.disabled=true;if(b.getAttribute('data-answer')===c.a)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('answerArea').insertAdjacentHTML('beforeend','<div class="feedback '+(ok?'good':'bad')+'"><strong>'+(ok?'✓ Rätt – bra återkallat!':'↻ Inte riktigt – den kommer tillbaka')+'</strong><p>'+esc(c.why)+'</p></div><p class="smallnote '+(saved?'':'warning')+'">'+(saved?'Svaret sparat på den här enheten.':'Obs! Webbläsaren kunde inte spara svaret.')+'</p>'+btn('Nästa fråga →','next()','primary wide'));const nextButton=$('answerArea').lastElementChild;if(nextButton)nextButton.focus()}
function next(){position++;renderQuestion()}
function finish(){data.sessions++;const saved=save();const count=queue.length;const done=Object.values(data.stats).filter(s=>s.right>=2&&s.last===true).length;$('app').innerHTML='<section class="hero"><div class="eyebrow">Träningspass klart</div><h1>Bra jobbat med minnet!</h1><p>Du fick '+correct+' rätt av '+count+' försök. '+(wrong?'De frågor du missade fick komma tillbaka i samma pass.':'Inga fel i det här passet!')+'</p><div class="stats"><div class="stat"><strong>'+correct+'</strong><span>Rätt svar</span></div><div class="stat"><strong>'+wrong+'</strong><span>Fel svar</span></div><div class="stat"><strong>'+done+'</strong><span>Starka minnen</span></div></div></section><section class="panel"><h2>Nästa steg</h2><p>Testa gärna ett nytt pass senare. Att plocka fram kunskapen igen efter en paus stärker minnet.</p><div class="stack">'+btn('Ett nytt träningspass','renderHome()','primary wide')+btn('Se rapport','renderReport()','secondary wide')+'</div>'+(saved?'':'<p class="warning">Varning: webbläsaren kunde inte spara framstegen.</p>')+'</section>'}
function confirmExit(){if(window.confirm('Avsluta passet? Redan besvarade frågor är sparade.'))renderHome()}
function reportText(){const lines=['OLLES MINNESLAB – BIOLOGIHÄFTET','Datum: '+new Date().toLocaleString('sv-SE'),'Träningspass: '+data.sessions,''];const areas=[...new Set(CARDS.map(c=>c.area))];for(const a of areas){const subset=CARDS.filter(c=>c.area===a);const practiced=subset.filter(c=>data.stats[c.id]);const strong=practiced.filter(c=>data.stats[c.id].right>=2&&data.stats[c.id].last);lines.push(a+': '+practiced.length+'/'+subset.length+' frågor tränade, '+strong.length+' starka');for(const c of practiced.filter(c=>data.stats[c.id].last===false))lines.push('  Behöver repeteras: '+c.q)}lines.push('','Framstegen sparas lokalt på den här enheten. Rapporten är en ögonblicksbild.');return lines.join('\n')}
function renderReport(){const tried=CARDS.filter(c=>data.stats[c.id]).length;const strong=CARDS.filter(c=>data.stats[c.id]&&data.stats[c.id].right>=2&&data.stats[c.id].last).length;const areas=[...new Set(CARDS.map(c=>c.area))];$('app').innerHTML='<section class="hero"><div class="eyebrow">📊 Rapport</div><h1>Så går det för Olle</h1><p>Framstegen är sparade i just den här webbläsaren.</p><div class="stats"><div class="stat"><strong>'+tried+'/'+CARDS.length+'</strong><span>Tränade frågor</span></div><div class="stat"><strong>'+strong+'</strong><span>Starka minnen</span></div><div class="stat"><strong>'+data.sessions+'</strong><span>Avslutade pass</span></div></div></section><section class="panel"><h2>Ämnesområden</h2>'+areas.map(a=>{const list=CARDS.filter(c=>c.area===a);const seen=list.filter(c=>data.stats[c.id]);const need=seen.filter(c=>!data.stats[c.id].last);return '<div class="area"><span>'+esc(a)+'</span><span>'+seen.length+'/'+list.length+' tränade'+(need.length?' · <b class="warning">'+need.length+' att repetera</b>':'')+'</span></div>'}).join('')+'</section><section class="panel"><h2>Dela med en vuxen</h2><p>Kopiera rapporten och klistra in den i ett sms eller här i ChatGPT. Inga resultat skickas automatiskt.</p><div class="stack">'+btn('📋 Kopiera progressrapport','copyReport()','primary wide')+btn('← Tillbaka till träningen','renderHome()','secondary wide')+'</div><p id="copyStatus" class="smallnote" aria-live="polite"></p></section>'}
async function copyReport(){const txt=reportText();try{await navigator.clipboard.writeText(txt);$('copyStatus').textContent='Kopierad! Klistra in i ett meddelande.'}catch(e){window.prompt('Kopiera rapporten:',txt)}}
renderHome();
</script></body></html>
