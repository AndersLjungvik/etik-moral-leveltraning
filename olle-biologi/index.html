}@keyframes heroShot{0%{left:23%;opacity:0;transform:scale(.6)}15%{opacity:1}85%{opacity:1}100%{left:76%;opacity:0;transform:scale(1.3) rotate(300deg)}}@keyframes bossLunge{0%,100%{transform:translateX(0)}35%{transform:translateX(-42px) scale(1.13)}}@keyframes heroHit{0%,100%{transform:translateX(0)}30%{transform:translateX(-14px) rotate(-12deg);filter:brightness(2)}}@keyframes bossHit{0%,100%{transform:translateX(0)}30%{transform:translateX(20px) rotate(12deg);filter:brightness(2)}}@keyframes heroPower{0%,100%{transform:scale(1)}40%{transform:scale(1.15)}}@media(prefers-reduced-motion:reduce){.arena .battle-projectile{animation-duration:.01ms}.arena .sprite,.enemy-fighter,.arena-approach>div{animation:none!important;transition:none!important}}.boss-question{background:#f7fbff;color:#17283c;border-radius:15px;padding:22px;margin-top:15px}.boss-question h3{font-size:1.2rem}.boss-question .choice{font-size:.95rem}.boss-question .explain{font-size:.9rem}

function renderHome(){
const count=tracks.filter(t=>completed(t.id)).length;const bossCount=bosses.filter(b=>state.bosses[b.id]).length;const percent=Math.round((count+bossCount)/9*100);
$('app').innerHTML='<section class="hero"><div class="eyebrow">NO-provet • torsdag 15 oktober</div><h1>Rädda den genetiska koden.</h1><p>Sex träningsbanor. Tre bossar. En hemlig final. Du börjar med begreppen och slutar med att förklara hur livet förändras.</p><div class="chips"><span class="chip">🧬 Genetik</span><span class="chip">🔬 Celldelning</span><span class="chip">🧪 Genteknik</span><span class="chip">🦎 Evolution</span></div><div class="actions">'+btn('Börja träna →',"openTrack('dna',0)")+' '+btn('Träna 26 begrepp',"go('terms')",'secondary')+'</div></section><section class="card"><div class="section-head"><h2>Din expedition</h2><span class="mini">'+count+'/6 banor • '+bossCount+'/3 bossar</span></div><div class="progress" aria-label="Totala framsteg"><div style="width:'+percent+'%"></div></div><div class="statrow"><span class="muted">Framsteg sparas på den här enheten.</span><strong>'+percent+' %</strong></div><div class="grid">'+tracks.map((t,i)=>'<article class="track"><div class="track-top"><span class="num">'+(i+1)+'</span><span class="status '+(completed(t.id)?'done':'')+'">'+(completed(t.id)?'✓ KLAR':state.levels[t.id]&&state.levels[t.id][0]?'NIVÅ 2 ÖPPEN':'2 NIVÅER')+'</span></div><h3>'+t.icon+' '+t.name+'</h3><p>'+t.desc+'</p><small>Underlag: s. '+t.page+'</small><div class="btnrow">'+btn(completed(t.id)?'Spela igen ↻':'Öppna bana →',"openTrack('"+t.id+"',0)")+'</div></article>').join('')+'</div><h2 style="margin:26px 0 10px">Bossarenan</h2><p class="muted">Bossarna låses upp när motsvarande två banor är avklarade. De kan spelas flera gånger med blandade frågor.</p><div class="boss-strip">'+bosses.map(b=>'<article class="boss-card '+(bossOpen(b)?'':'locked')+'"><div class="mini">'+(state.bosses[b.id]?'✓ BESEGRAD':bossOpen(b)?'⚡ UPPLÅST':'🔒 LÅST')+'</div><h3>'+b.icon+' '+b.name+'</h3><p>'+b.tag+'</p><button class="'+(bossOpen(b)?'gold':'secondary')+'" '+(bossOpen(b)?'':'disabled')+' onclick="startBoss(\''+b.id+'\')">'+(bossOpen(b)?'Utmaning →':'Klara banorna först')+'</button></article>').join('')+'</div><div style="margin-top:18px" class="'+(allComplete()?'summary':'boss-card locked')+'"><div class="eyebrow">'+(allComplete()?'⚡ FINALBOSS UNLOCKED':'🔒 FINALBOSS LÅST')+'</div><h2 style="margin:8px 0">BIOBOSS Ω</h2><p>Slutstriden blandar genetik, genteknik och evolution. Låses upp när alla sex banor och alla tre bossar är avklarade.</p>'+btn(allComplete()?'MÖT BIOBOSS Ω ⚡':'Inte upplåst än',"startBoss('omega')",allComplete()?'gold':'secondary')+'</div></section>';
}
function openTrack(id,l){trackId=id;level=l;mode='track';const t=tracks.find(x=>x.id===id);if(!t)return;if(l===1&&!(state.levels[id]&&state.levels[id][0])){go('home');return}queue=rand(l===0?t.mc:t.ex);qi=0;score=0;answered=false;currentView='play';drawTrack()}
function drawTrack(){const t=tracks.find(x=>x.id===trackId);const q=queue[qi];if(!q){finishTrack();return}
let body='<div class="mini">FRÅGA '+(qi+1)+' / '+queue.length+' • '+(level===0?'KÄNN IGEN':'FÖRKLARA SJÄLV')+'</div><h3>'+esc(q.p)+'</h3>';
if(level===0){choiceOrder=rand(q.o);body+='<div class="choices">'+choiceOrder.map((o,i)=>'<button class="choice" id="opt'+i+'" onclick="answerMC('+i+')">'+esc(o)+'</button>').join('')+'</div><div id="feedback"></div>'}
else{body+='<textarea id="own" aria-label="Ditt svar" placeholder="Förklara med egna ord innan du tittar på svaret ..."></textarea><div id="feedback"></div><div class="btnrow" id="checkbtn">'+btn('Jämför med exempel →','showModel()')+'</div>'}
$('app').innerHTML='<section class="card"><div class="section-head"><div><div class="mini">BANA '+(tracks.indexOf(t)+1)+'</div><h2>'+t.icon+' '+t.name+'</h2></div>'+btn('← Alla banor',"go('home')",'outline')+'</div><div class="level-tabs"><button class="'+(level===0?'current':'')+'" onclick="openTrack(\''+trackId+'\',0)">Nivå 1 • Känn igen</button><button class="'+(level===1?'current':'')+'" '+(state.levels[trackId]&&state.levels[trackId][0]?'':'disabled')+' onclick="openTrack(\''+trackId+'\',1)">Nivå 2 • Förklara</button></div><div class="statrow"><span class="muted">Poäng: '+score+' • Målet: '+(level===0?Math.ceil(queue.length*.6):Math.ceil(queue.length*2/3))+' rätt</span><span class="mini">'+(qi+1)+' / '+queue.length+'</span></div><div class="progress"><div style="width:'+(qi/queue.length*100)+'%"></div></div><div class="question">'+body+'</div></section>';
}
function answerMC(i){if(answered)return;answered=true;const q=queue[qi],val=choiceOrder[i],ok=val===q.a;if(ok){score++;delete state.wrong[trackId+':'+q.p]}else state.wrong[trackId+':'+q.p]={p:q.p,o:q.o,a:q.a,e:q.e};save();document.querySelectorAll('.choice').forEach((el,j)=>{el.disabled=true;if(choiceOrder[j]===q.a)el.classList.add('correct');else if(j===i)el.classList.add('wrong')});$('feedback').innerHTML='<div class="explain '+(ok?'good':'bad')+'"><strong>'+(ok?'✓ Rätt!':'↻ Inte riktigt.')+'</strong> '+esc(q.e)+'</div><div class="btnrow">'+btn(qi===queue.length-1?'Se resultat →':'Nästa fråga →','nextQuestion()')+'</div>'}
function showModel(){if(answered)return;answered=true;const q=queue[qi];$('own').disabled=true;$('checkbtn').classList.add('hidden');$('feedback').innerHTML='<div class="explain"><b>Exempel på ett bra svar:</b><p>'+esc(q.m)+'</p><small>'+esc(q.h)+'</small></div><p style="margin-top:15px"><b>Kunde du förklara det viktigaste utan att läsa exemplet?</b></p><div class="btnrow">'+btn('Ja, jag kunde ✓','markExplain(true)')+' '+btn('Jag behöver öva ↻','markExplain(false)','secondary')+'</div>'}
function markExplain(ok){if(ok)score++;else state.wrong[trackId+':'+queue[qi].p]={p:queue[qi].p,m:queue[qi].m,h:queue[qi].h};if(ok)delete state.wrong[trackId+':'+queue[qi].p];save();nextQuestion()}
function nextQuestion(){qi++;answered=false;if(qi>=queue.length)finishTrack();else drawTrack()}
function finishTrack(){const t=tracks.find(x=>x.id===trackId),need=level===0?Math.ceil(queue.length*.6):Math.ceil(queue.length*2/3),pass=score>=need;if(pass){if(!state.levels[trackId])state.levels[trackId]={};state.levels[trackId][level]=true;save()}
const isDone=completed(trackId);let action=pass?(level===0?btn('Fortsätt till nivå 2 →',"openTrack('"+trackId+"',1)"):btn('Till kartan →',"go('home')")):btn('Försök igen ↻',"openTrack('"+trackId+"',"+level+")");
$('app').innerHTML='<section class="card"><div class="summary"><div class="eyebrow">'+(pass?'NIVÅ AVKLARAD':'TRÄNA EN GÅNG TILL')+'</div><h2>'+(pass?'Bra jobbat! ⚡':'Du är på väg!')+'</h2><p>Du fick '+score+' av '+queue.length+'. Målet är '+need+'. '+(pass?'Din nivå är sparad.':'Försök igen med frågorna i ny ordning.')+'</p><div class="btnrow">'+action+' '+btn('Repetera svåra frågor',"go('review')",'secondary')+'</div></div>'+(isDone?'<p style="margin-top:18px">🎉 Hela banan är klar. Kolla om en ny boss har låsts upp!</p>':'')+'</section>';window.scrollTo(0,0)}
function renderTerms(){const cats=[['all','Alla 26'],['genetik','DNA & gener'],['celldelning','Celldelning'],['nedarvning','Nedärvning'],['bioteknik','Förädling & GMO']];const data=terms.map((t,i)=>({t:t,i:i})).filter(x=>cardFilter==='all'||x.t[2]===cardFilter);
$('app').innerHTML='<section class="card"><div class="section-head"><div><div class="eyebrow">FLASHCARDS</div><h2>26 begrepp</h2></div>'+btn('Blanda korten ↻','shuffleTerms()','outline')+'</div><p class="muted">Försök förklara begreppet högt innan du vänder kortet. Klicka för att visa förklaringen. De 26 begreppen följer Olles begreppsblad, med några preciseringar.</p><div class="filter">'+cats.map(c=>'<button class="'+(cardFilter===c[0]?'selected':'')+'" onclick="filterTerms(\''+c[0]+'\')">'+c[1]+'</button>').join('')+'</div><div class="term-grid" id="termGrid">'+data.map(x=>termHTML(x.t,x.i)).join('')+'</div></section>'}
function termHTML(t,i){return '<button class="term '+(shown[i]?'revealed':'')+'" onclick="flipTerm('+i+')"><b>'+esc(t[0])+'</b><span class="def">'+(shown[i]?esc(t[1]):'Tänk själv först ...')+'</span><span class="hint">'+(shown[i]?'↻ Dölj svaret':'↪ Visa förklaringen')+'</span></button>'}
function flipTerm(i){shown[i]=!shown[i];renderTerms()}
function filterTerms(cat){cardFilter=cat;renderTerms()}
function shuffleTerms(){shown={};const g=$('termGrid');if(g){let arr=Array.from(g.children);rand(arr).forEach(el=>g.appendChild(el))}}
function eyeHtml(g){return '<span class="eye '+(g==='bb'?'blue':'brown')+'" aria-label="'+(g==='bb'?'Blå':'Brun')+' ögonfärg"></span>'}
function renderCross(){currentView='cross';$('app').innerHTML='<section class="card"><div class="eyebrow">INTERAKTIVT LABB • ARV OCH ÖGONFÄRG</div><h2>👀 Korsningslabbet</h2><p>Välj föräldrarnas ögon och se vilka kombinationer barnen kan få. Vi använder en <b>förenklad modell</b>: B står för brunt och b för blått. I modellen dominerar B över b.</p><div class="cross-layout"><div><div class="cross-controls"><label>Förälder 1<select id="parent1" onchange="calcCross()"><option value="BB">Bruna ögon (BB)</option><option value="Bb" selected>Bruna ögon (Bb)</option><option value="bb">Blå ögon (bb)</option></select></label><label>Förälder 2<select id="parent2" onchange="calcCross()"><option value="BB">Bruna ögon (BB)</option><option value="Bb" selected>Bruna ögon (Bb)</option><option value="bb">Blå ögon (bb)</option></select></label></div><div id="eyeParents" class="eye-pair"></div><div id="crossResults" class="cross-results"></div><div class="btnrow">'+btn('Två brunögda',"setCross('Bb','Bb')",'secondary')+' '+btn('Bruna + blå',"setCross('Bb','bb')",'secondary')+' '+btn('Två blåögda',"setCross('bb','bb')",'secondary')+'</div></div><div><div class="mini" style="margin-bottom:10px">KORSNINGSSCHEMA • MÖJLIGA BARN</div><div class="punnett" id="punnett"></div><p class="muted" style="margin-top:12px">Varje ruta motsvarar en lika sannolik kombination i modellen. Ett barns verkliga ögonfärg går inte att räkna ut så här.</p></div></div><div class="cross-note"><b>Viktigt:</b> Människans ögonfärg styrs av flera gener och deras samspel. Det här är ett påhittat, förenklat en-gens-exempel för att lära sig <b>dominant, recessivt, genotyp och fenotyp</b> – inte en säker förutsägelse av verkliga barns ögonfärg.</div></section>';calcCross()}
function setCross(a,b){$('parent1').value=a;$('parent2').value=b;calcCross()}
function calcCross(){const g1=$('parent1').value,g2=$('parent2').value;const a=g1.split(''),b=g2.split('');const combine=(x,y)=>[x,y].sort((u,v)=>u==='B'?-1:v==='B'?1:0).join('');const children=[combine(a[0],b[0]),combine(a[0],b[1]),combine(a[1],b[0]),combine(a[1],b[1])];$('eyeParents').innerHTML=[g1,g2].map((g,i)=>'<div class="eye-person">'+eyeHtml(g)+'<strong>Förälder '+(i+1)+'</strong><small>'+(g==='bb'?'Blå ögon':'Bruna ögon')+' • '+g+'</small></div>').join('');const cell=(x,i)=>'<div class="'+(i===0?'corner':i<3||i%3===0?'axis':'')+'">'+(i>2&&i%3!==0?'<span class="offspring">'+eyeHtml(x)+'<small>'+x+'</small></span>':x)+'</div>';$('punnett').innerHTML=['',b[0],b[1],a[0],children[0],children[1],a[1],children[2],children[3]].map(cell).join('');const count={BB:0,Bb:0,bb:0};children.forEach(x=>count[x]++);const brown=4-count.bb;$('crossResults').innerHTML='<b>Hur kan barnens ögon se ut i modellen?</b><div class="eye-percent">'+eyeHtml('BB')+'<span><b>'+brown*25+' %</b> bruna ögon</span></div><div class="eye-percent">'+eyeHtml('bb')+'<span><b>'+count.bb*25+' %</b> blå ögon</span></div><p class="muted">Genotyper: BB '+count.BB*25+' % • Bb '+count.Bb*25+' % • bb '+count.bb*25+' %</p><small>BB och Bb ger bruna ögon i modellen. bb ger blå.</small>'}
function renderReview(){const items=Object.values(state.wrong||{});$('app').innerHTML='<section class="card"><div class="eyebrow">RETRIEVAL PRACTICE</div><h2>Repetera det svåra</h2><p>Frågor du missat samlas här. Försök svara utan hjälp innan du öppnar förklaringen. Rätt besvarade flervalsfrågor försvinner från listan.</p><p class="mini">'+items.length+' frågor att träna</p>'+(items.length?btn('Starta repetition →','startReview()'):'<div class="empty">Inga svåra frågor noterade än. Spela en bana eller boss så fylls listan på.</div>')+'</section>'}
function startReview(){let list=Object.values(state.wrong||{}).filter(x=>x.o);if(!list.length){$('app').innerHTML='<section class="card"><h2>Repetera med egna ord</h2>'+Object.values(state.wrong||{}).map(x=>'<div class="question"><h3>'+esc(x.p)+'</h3><details><summary>Visa ett exempelsvar</summary><p>'+esc(x.m||'')+'</p></details></div>').join('')+btn('Till banorna',"go('home')")+'</section>';return}mode='review';queue=rand(list);qi=0;score=0;drawReview()}
function drawReview(){const q=queue[qi];if(!q){$('app').innerHTML='<section class="card"><div class="summary"><h2>Repetitionen klar!</h2><p>'+score+' av '+queue.length+' rätt. Frågor du fortfarande missar ligger kvar i repetitionen.</p>'+btn('Till startsidan',"go('home')")+'</div></section>';return}choiceOrder=rand(q.o);$('app').innerHTML='<section class="card"><div class="section-head"><h2>Repetition • '+(qi+1)+' / '+queue.length+'</h2>'+btn('← Tillbaka',"go('review')",'outline')+'</div><div class="question"><h3>'+esc(q.p)+'</h3><div class="choices">'+choiceOrder.map((x,i)=>'<button class="choice" id="opt'+i+'" onclick="answerReview('+i+')">'+esc(x)+'</button>').join('')+'</div><div id="feedback"></div></div></section>'}
function answerReview(i){const q=queue[qi],ok=choiceOrder[i]===q.a;document.querySelectorAll('.choice').forEach((el,j)=>{el.disabled=true;if(choiceOrder[j]===q.a)el.classList.add('correct');else if(j===i)el.classList.add('wrong')});if(ok){score++;Object.keys(state.wrong).forEach(k=>{if(state.wrong[k].p===q.p)delete state.wrong[k]})}save();$('feedback').innerHTML='<div class="explain '+(ok?'good':'bad')+'">'+(ok?'✓ Rätt! ':'↻ Försök komma ihåg detta: ')+esc(q.e)+'</div><div class="btnrow">'+btn('Nästa →','qi++;drawReview()')+'</div>'}
function startBoss(id){const b=bosses.find(x=>x.id===id);demoMode=previewId===id&&['b2','b3','omega'].includes(id);if(id==='omega'&&!allComplete()&&!demoMode){go('home');return}if(b&&!bossOpen(b)&&!demoMode){go('home');return}if(id==='b1'){window.location.href='./dna-vaktaren.html';return}bossId=id;hp=4;bhp=id==='omega'?8:5;bossApproach=0;queue=rand(id==='omega'?finalPool:b.pool);qi=0;score=0;currentView='boss';drawBoss()}
function drawBoss(){const b=bosses.find(x=>x.id===bossId),name=b?b.name:'BIOBOSS Ω',icon=b?b.icon:'🐉',q=queue[qi%queue.length];choiceOrder=rand(q.o);
$('app').innerHTML='<section class="card"><div class="section-head"><div><div class="eyebrow">'+(demoMode?'FÖRHANDSVISNING • FRAMSTEG SPARAS INTE':'BOSSFIGHT')+' • '+(bossId==='omega'?'FINALBOSS':'MELLANBOSS')+'</div><h2>⚔️ '+name+'</h2></div>'+btn('← Till banorna',"go('home')",'outline')+'</div><p class="muted">Bossen närmar sig mellan frågorna. Fel svar: han skjuter DNA-attack och tar ett hjärta. Rätt svar: du skjuter tillbaka och pressar bort honom. Läs i lugn och ro – ingen tidsgräns!</p><div class="arena" id="battleScene"><div class="hud"><span id="bossHeroHp">❤️ '+hp+' / 4</span><span id="bossEnemyHp">⚡ BOSSENERGI: '+bhp+'</span></div><div class="fighters"><div class="fighter hero-fighter"><div class="sprite">🧑‍🚀</div><div class="arena-name">OLLE</div></div><div class="vs">VS</div><div class="fighter enemy-fighter" id="approachingBoss" style="transform:translateX(-'+Math.round(bossApproach*35)+'px)"><div class="sprite enemy">'+icon+'</div><div class="arena-name">'+name+'</div></div></div><div class="arena-status" id="battleStatus" aria-live="polite">'+(bossApproach>2.8?'⚠️ Bossen är nära!':'👣 Bossen närmar sig steg för steg…')+'</div><div class="arena-approach" aria-label="Bossens avstånd"><div id="approachBar" style="--pressure:'+Math.round(bossApproach/4*100)+'%"></div></div><div id="battleEffect" aria-hidden="true"></div></div><div class="boss-question"><div class="mini">ATTACK '+(qi+1)+'</div><h3>'+esc(q.p)+'</h3><div class="choices">'+choiceOrder.map((x,i)=>'<button class="choice" id="opt'+i+'" onclick="answerBoss('+i+')">'+esc(x)+'</button>').join('')+'</div><div id="feedback" aria-live="polite"></div></div></section>'}
function answerBoss(i){const q=queue[qi%queue.length],ok=choiceOrder[i]===q.a;document.querySelectorAll('.choice').forEach((el,j)=>{el.disabled=true;if(choiceOrder[j]===q.a)el.classList.add('correct');else if(j===i)el.classList.add('wrong')});if(ok){bhp--;score++;bossApproach=Math.max(0,bossApproach-1.05);if(!demoMode)Object.keys(state.wrong).forEach(k=>{if(state.wrong[k].p===q.p)delete state.wrong[k]})}else{hp--;bossApproach=Math.min(4,bossApproach+1.05);if(!demoMode)state.wrong['boss:'+q.p]={p:q.p,o:q.o,a:q.a,e:q.e}}if(!demoMode)save();
$('bossHeroHp').textContent='❤️ '+hp+' / 4';$('bossEnemyHp').textContent='⚡ BOSSENERGI: '+bhp;
$('approachingBoss').style.transform='translateX(-'+Math.round(bossApproach*35)+'px)';$('approachBar').style.setProperty('--pressure',Math.round(bossApproach/4*100)+'%');
$('battleScene').classList.add(ok?'win-hit':'lose-hit');
$('battleEffect').innerHTML='<span class="battle-projectile '+(ok?'hero-shot':'enemy-shot')+'">'+(ok?'⚡':'🧬')+'</span>';
$('battleStatus').textContent=ok?'⚡ Du träffar! Bossen tvingas bakåt!':'💥 Bossen anfaller och kommer närmare!';
$('feedback').innerHTML='<div class="explain '+(ok?'good':'bad')+'"><b>'+(ok?'⚡ FULLTRÄFF!':'💥 BOSSEN TRÄFFAR!')+'</b> '+esc(q.e)+'</div><div class="btnrow">'+btn(bhp<=0?'Visa segern →':hp<=0?'Se resultat →':'Nästa attack →','nextBoss()')+'</div>'}
function nextBoss(){if(bhp<=0||hp<=0){finishBoss();return}qi++;bossApproach=Math.min(4,bossApproach+.32);if(qi>=queue.length){queue=rand(queue);qi=0}drawBoss()}
function finishBoss(){const win=bhp<=0;if(win&&!demoMode){if(bossId!=='omega')state.bosses[bossId]=true;else state.bosses.omega=true;save()}const final=bossId==='omega';$('app').innerHTML='<section class="card"><div class="'+(win?'summary':'boss-card')+'"><div class="eyebrow">'+(win?(demoMode?'🏆 DEMON AVKLARAD':'🏆 BOSS BESEGRAD'):'⚔️ FÖRSÖK IGEN')+'</div><h2>'+(win?(final?'DU HAR KLARAT BIO-LAB!':'Du vann striden!'):'Bossen vann den här gången')+'</h2><p>'+(win?'Du klarade '+score+' korrekta attacker. '+(final?'Alla områden är genomspelade – men fortsätt gärna repetera svåra frågor.':'En ny utmaning kan ha låsts upp.'):'Du klarade '+score+' attacker. Läs förklaringarna och gör ett nytt försök – frågorna blandas.')+'</p><div class="btnrow">'+btn('Spela bossen igen ↻',"startBoss('"+bossId+"')")+' '+btn('Till banorna',"go('home')",'secondary')+'</div></div></section>';window.scrollTo(0,0)}
function resetProgress(){if(!confirm('Vill du verkligen nollställa alla framsteg och sparade svåra frågor?'))return;state=empty();save();go('home')}
const sharedReport=params.get('report');if(sharedReport){const snapshot=decodeReport(sharedReport);if(snapshot)renderReport(snapshot);else $('app').innerHTML='<section class="card"><h2>Rapportlänken kunde inte läsas</h2><p>Be Olle kopiera en ny delningslänk från Framsteg.</p>'+btn('Till spelet',"window.location.href=window.location.pathname")+'</section>';}else{go('home');if(['b2','b3','omega'].includes(previewId))startBoss(previewId);else if(params.get('track')&&tracks.some(t=>t.id===params.get('track')))openTrack(params.get('track'),0);else if(params.get('view')==='cross')go('cross');else if(params.get('view')==='terms')go('terms');else if(params.get('view')==='report')go('report');}
</script>
